project: Zipper
platform: github
imagemagick: true
video_evidence: false
droid_control:
  plugin: droid-control@factory-plugins
  compose: false

environments:
  local:
    url: local CLI
    restrictions:
      - Use run-scoped QA data under qa-results/
      - Do not use production credentials or external services

default_target: local

auth:
  method: none
  provider: none

personas:
  - name: default
    description: 'CLI user generating synthetic e-discovery test data'
    credentials_source: none
    test_focus:
      - standard-mode
      - loadfile-only
      - loadfile-only-with-chaos
      - production-set
      - bates-numbering
      - target-zip-size
      - source-driven-generation
      - load-file-formats
      - archive-test-suite
      - production-manifest-comparison
      - version-output
    cannot_do: []

apps:
  cli:
    path_patterns:
      - "src/**"
      - "tests/**/*.sh"
      - "tests/**/*.bat"
      - "tests/fixtures/**"
      - "Directory.Build.props"
      - "global.json"
      - ".editorconfig"
      - "BannedSymbols.txt"
      - "zipper.sln"
    skill: qa-cli
    test_tool: tuistory
    build_command: 'dotnet publish src/Zipper.csproj -c Release -o "./qa-results/$RUN_ID/publish" -p:Version=qa-test -p:InformationalVersion=qa-test'

feature_flags:
  provider: none
  dashboard_url: ''
  how_to_override: ''

integrations: {}

cleanup:
  auto_cleanup: true
  strategy: delete-output-files
  instructions: 'Delete only qa-results/$RUN_ID/data and qa-results/$RUN_ID/publish after each run. Preserve qa-results/report.md and qa-results/$RUN_ID/evidence.'

failure_learning: suggest_in_report
