# Shared CI job graph: `lint`, `runner-tests`, `version-metadata`, and the
# three-OS `build-and-test` matrix, which stages the accepted Linux candidate
# for the caller's `goldens` job. Both `pr.yml` and `build-and-test.yml` call
# this file, so a gate added once applies to PRs and main together — the
# git-identity divergence that reddened main CI for 15 hours (#1173) came from
# these two callers drifting apart, and this file removes that class of bug.

name: CI

on:
  workflow_call:
    inputs:
      version:
        description: >-
          Semantic version passed to `dotnet publish -p:Version=` for
          self-contained release artifacts. Empty for PR builds.
        type: string
        default: ''
      release_version:
        description: Exact stable version of the reserved release candidate
        type: string
        default: ''
      source_sha:
        description: Source SHA for release/recovery (empty for PR checkout)
        type: string
        default: ''
      publish_mode:
        description: >-
          self-contained = publish per-RID binaries for the release job;
          goldens = publish per-RID candidates for acceptance, then stage the
          accepted Linux candidate for the caller's goldens job;
          none = publish nothing.
        type: string
        default: none

permissions:
  contents: read

env:
  # Opt-in to Node.js 24 for JS-based actions that still default to Node 20.
  # See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: eifinger/actionlint-action@1fc89649be682d16ec5cf65ea16e269eb88d3982 # v1.10.2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore (locked)
        run: dotnet restore zipper.sln --locked-mode
      - name: Lint code style
        run: dotnet format --verify-no-changes --no-restore
      - name: Validate requirement traceability
        shell: bash
        run: bash tests/validate-req-traceability.sh --strict
      - name: Validate E2E .sh/.bat parity
        shell: bash
        run: bash tests/validate-e2e-parity.sh --strict
      - name: Check for oversized files
        shell: bash
        run: |
          set -euo pipefail
          MAX_BYTES=$((500 * 1024))  # 500 KB
          oversized=$(find src -type f -size +${MAX_BYTES}c -not -name '*.json' -not -name '*.dat' -not -name '*.opt' 2>/dev/null || true)
          if [[ -n "$oversized" ]]; then
            echo "ERROR: Files exceeding ${MAX_BYTES} bytes found:" >&2
            echo "$oversized" >&2
            exit 1
          fi
          echo "No oversized files detected (limit: ${MAX_BYTES} bytes)."

      - name: Check no swallowed test output (#973)
        shell: bash
        run: |
          set -euo pipefail
          # unittest and runner.py output must never go to /dev/null —
          # #973 needed an extra PR (#974) just to read the traceback.
          # Tee to a log and cat on failure instead.
          swallowed=$(grep -rnE '(python3? -m unittest|runner\.py)[^|]*([12]?>>?|&>>?) */dev/null' tests/ tools/ .github/ 2>/dev/null || true)
          if [[ -n "$swallowed" ]]; then
            echo "ERROR: swallowed test output detected (tee to a log instead):" >&2
            echo "$swallowed" >&2
            exit 1
          fi
          echo "No swallowed test output detected."

  # `.zipper-runner/tests/` exercises the autonomous runner at its CLI,
  # subprocess, and Git boundaries. Running it here (instead of inside the .NET
  # E2E suite) keeps a runner-env failure from looking like a product failure,
  # and gives it its own checkout without the .NET build in the way.
  runner-tests:
    runs-on: ${{ matrix.os }}
    # This job runs two suites (.zipper-runner/tests + tests/ci) and macOS is ~3x
    # slower than Ubuntu for both. Measured macOS totals span 123-250s, and one run
    # did 303s of work before being cancelled at a 300s wall with every step green:
    # a slow shared runner then fails a required check and blocks the PR. 12 minutes
    # is ~2.4x the worst observed total, and still catches a genuinely hung suite.
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        # POSIX runners only. These suites install fake executables with a
        # `#!/usr/bin/env python3` shebang and chmod +x (test_droid_plugin.py,
        # test_runner_friction.py's `_create_fake_cr`); Windows has no shebang
        # support, so `subprocess` cannot execute them and the module-level
        # assertions fail at import. Verified on the Windows leg: the suites
        # were never actually exercised on Windows — the run-tests.bat that
        # supposedly ran them was a no-op (see ci.yml's E2E steps).
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Initialize missing Git identity for CI fixtures
        shell: bash
        run: |
          # Defence in depth. The fixture suites now carry their own identity
          # (.zipper-runner/tests/gitenv.py), so this is NOT what makes them
          # pass; it covers Git work in this job outside those suites, and any
          # future suite that commits without importing gitenv. Only fills a
          # genuinely absent identity, so a configured one is kept.
          if ! git config user.name >/dev/null; then
            git config --global user.name 'github-actions[bot]'
          fi
          if ! git config user.email >/dev/null; then
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          fi

      # Tee to a log as well as the console (#973): a non-zero exit must never
      # swallow the traceback that explains it. GitHub's default `shell: bash`
      # already runs with -e -o pipefail, so a failing child fails the step.
      - name: Run zipper-runner unit tests
        shell: bash
        run: python3 -m unittest discover -s .zipper-runner/tests 2>&1 | tee zipper-runner-tests.log

      - name: Run release recovery and executable override regressions
        shell: bash
        run: python3 -m unittest discover -s tests/ci -v

  golden-tests:
    name: Golden helper and runner tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Run golden helper and runner tests
        shell: bash
        run: python3 -m unittest discover -s tests/goldens/lib/_test -p 'test_*.py' -v

  # REQ-033/REQ-034: compiled version metadata. `tests/test-build-version.sh`
  # compiles src/Zipper.csproj once per asserted version (three times), which
  # is why it does not belong inside a matrix leg: in the Linux leg it
  # serialized ~3 minutes in front of the build, unit tests, E2E, and goldens
  # handoff. As its own job it runs in parallel; a failure still fails the
  # caller's `ci` job and therefore `ci-gate`.
  version-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Compiled development and stable version regressions
        shell: bash
        run: bash tests/test-build-version.sh

  build-and-test:
    # `runner-tests` is deliberately NOT a dependency: a flaky runner suite must
    # not skip the build, unit tests, coverage gate, and E2E legs behind it.
    # The caller's `ci` job already requires every job here to succeed, so
    # gate strength is unchanged.
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            coverage: true
          - os: windows-latest
            platform: win-x64
            coverage: false
          - os: macos-latest
            platform: osx-arm64
            coverage: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Initialize missing Git identity for CI fixtures
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Defence in depth for Git work in the full E2E suite that is not the
          # runner fixture suites (those carry their own identity). Only fills
          # genuinely absent identity, so a configured one is kept.
          if ! git config user.name >/dev/null; then
            git config --global user.name 'github-actions[bot]'
          fi
          if ! git config user.email >/dev/null; then
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          fi

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore (locked)
        run: dotnet restore zipper.sln --locked-mode

      - name: Build solution (Release, includes tests)
        shell: bash
        env:
          BUILD_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          flags=("-p:SourceRevisionId=$SOURCE_SHA")
          if [[ -n "$BUILD_VERSION" ]]; then flags+=("-p:Version=$BUILD_VERSION"); fi
          dotnet build zipper.sln -c Release --no-restore "${flags[@]}"

      # Unit tests + coverage on Linux only (single pass with the coverage collector).
      - name: Unit tests + coverage (Linux)
        if: matrix.coverage == true
        run: |
          dotnet test src/Zipper.Tests/Zipper.Tests.csproj \
            -c Release --no-build \
            --logger "console;verbosity=normal" \
            --logger "junit;LogFilePath=TestResults/test-results.xml" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults
          dotnet test src/Zipper.Analyzers.Tests/Zipper.Analyzers.Tests.csproj \
            -c Release --no-build \
            --logger "console;verbosity=normal"

      - name: Check for deprecated/vulnerable NuGet packages (Linux)
        if: matrix.coverage == true
        shell: bash
        run: |
          set -euo pipefail
          # `--unused` is not a valid `dotnet list package` option (it was a
          # silent no-op masked by `|| true`). Use the real checks instead.
          #
          # Deprecated: informational only — xunit v2 is flagged "Legacy" by
          # design, which would otherwise break every build.
          echo "::group::Deprecated packages (informational)"
          dotnet list package --deprecated --include-transitive
          echo "::endgroup::"
          # Vulnerable: hard gate. The tool prints finding rows prefixed with
          # `>`; a clean project prints "has no vulnerable packages".
          vuln=$(dotnet list package --vulnerable --include-transitive)
          echo "$vuln"
          if echo "$vuln" | grep -qE '^[[:space:]]*>'; then
            echo "ERROR: vulnerable packages detected." >&2
            exit 1
          fi
          echo "No vulnerable packages detected."

      - name: Test timing report (Linux)
        if: matrix.coverage == true
        run: |
          if [[ -f TestResults/test-results.xml ]]; then
            python3 -c "from textwrap import dedent; exec(dedent('''
            import xml.etree.ElementTree as ET
            tree = ET.parse('TestResults/test-results.xml')
            tests = [(t.get('classname',''), t.get('name',''), float(t.get('time',0))) for t in tree.iter() if t.tag == 'testcase' and float(t.get('time',0)) > 0.5]
            tests.sort(key=lambda x: -x[2])
            print('Slowest tests (>0.5s):')
            for cls, name, secs in tests[:20]:
                print(f'  {secs:.2f}s  {cls}.{name}')
            if not tests:
                print('All tests under 0.5s')
            '''))"
          fi

      - name: Property-based test gate & summary (Linux)
        if: matrix.coverage == true
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "from textwrap import dedent; exec(dedent('''
          import os, sys, xml.etree.ElementTree as ET
          from collections import defaultdict
          xml_path = next((p for p in ['TestResults/test-results.xml', 'src/Zipper.Tests/TestResults/test-results.xml'] if os.path.exists(p)), None)
          if not xml_path:
              print('ERROR: test-results.xml not found.', file=sys.stderr)
              sys.exit(1)
          tree = ET.parse(xml_path)
          suites = defaultdict(lambda: [0, 0, 0.0, 0])
          for t in tree.iter('testcase'):
              cls = t.get('classname', '')
              if cls.startswith('Zipper.Tests.Properties.'):
                  short = cls.split('.')[-1]
                  suites[short][0] += 1
                  if t.find('failure') is not None or t.find('error') is not None:
                      suites[short][1] += 1
                  elif t.find('skipped') is not None:
                      suites[short][3] += 1
                  suites[short][2] += float(t.get('time', 0))
          total = sum(v[0] for v in suites.values())
          failed = sum(v[1] for v in suites.values())
          skipped = sum(v[3] for v in suites.values())
          passed = total - failed - skipped
          secs = sum(v[2] for v in suites.values())
          print(f'Property-based tests (FsCheck.Xunit): {passed}/{total} passing properties (~{passed * 100} cases at MaxTest=100) in {secs:.2f}s (failed: {failed}, skipped: {skipped})')
          for name, (cnt, fl, tm, sk) in sorted(suites.items()):
              print(f'  - {name}: {cnt - fl - sk}/{cnt} passing ({tm:.2f}s, failed={fl}, skipped={sk})')
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              bt = chr(96)
              with open(summary_path, 'a', encoding='utf-8') as f:
                  print('### Property-Based Tests (FsCheck.Xunit)', file=f)
                  print('', file=f)
                  print('| Suite | Passing / Total | Configured Cases (MaxTest=100) | Duration (s) |', file=f)
                  print('|-------|----------------:|-------------------------------:|-------------:|', file=f)
                  for name, (cnt, fl, tm, sk) in sorted(suites.items()):
                      ps = cnt - fl - sk
                      print(f'| {bt}{name}{bt} | {ps} / {cnt} | {ps * 100} | {tm:.2f} |', file=f)
                  print(f'| **Total** | **{passed} / {total}** | **{passed * 100}** | **{secs:.2f}** |', file=f)
                  print('', file=f)
          if passed < 40 or failed > 0:
              print(f'ERROR: Expected >= 40 passing property tests, got passed={passed}, total={total}, failed={failed}, skipped={skipped}', file=sys.stderr)
              sys.exit(1)
          '''))"

      - name: Coverage report + 80% gate (Linux)
        if: matrix.coverage == true
        uses: ./.github/actions/coverage-gate

      # Two steps, one per project: on Windows the default shell is pwsh, which
      # reports the LAST command's exit code, so a failing first `dotnet test`
      # would be masked by a succeeding second one (observed on #1174, where
      # 1060 real failures were reported as a green leg).
      - name: Unit tests (non-Linux)
        if: matrix.coverage != true
        shell: bash
        run: |
          dotnet test src/Zipper.Tests/Zipper.Tests.csproj \
            -c Release --no-build \
            --logger "console;verbosity=normal" \
            --logger "junit;LogFilePath=TestResults/test-results.xml" \
            --results-directory ./TestResults

      - name: Analyzer unit tests (non-Linux)
        if: matrix.coverage != true
        run: dotnet test src/Zipper.Analyzers.Tests/Zipper.Analyzers.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      # Full E2E suite runs on every OS (no shortcuts). Each leg gets the native
      # shell for its runner: a .bat executed from Git Bash is a silent no-op,
      # so the Windows leg used to "pass" without running anything.
      - name: Run full E2E suite (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ZIPPER_EXECUTABLE="$PWD/src/bin/Release/net10.0/Zipper" bash ./tests/run-tests.sh

      - name: Run full E2E suite (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "ZIPPER_EXECUTABLE=%CD%\src\bin\Release\net10.0\Zipper.exe"
          call tests\run-tests.bat

      # Publish self-contained per platform, for the release job on main.
      - name: Publish self-contained binaries
        if: inputs.publish_mode != 'none'
        shell: bash
        run: |
          set -euo pipefail
          # -p:Version must arrive through the environment so an empty input
          # cannot produce a malformed `-p:Version=` argument. A plain string
          # (not a bash array) keeps the expansion safe on the macOS leg, where
          # /bin/bash is 3.2 and `"${empty_array[@]}"` under `set -u` aborts
          # with "unbound variable".
          VERSION_FLAG=""
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION_FLAG="-p:Version=${INPUT_VERSION}"
          fi
          # shellcheck disable=SC2086  # deliberate word-splitting: an empty
          # VERSION_FLAG must expand to zero arguments.
          dotnet publish src/Zipper.csproj -c Release -r ${{ matrix.platform }} \
            --self-contained true -o publish/${{ matrix.platform }} \
            $VERSION_FLAG "-p:SourceRevisionId=$SOURCE_SHA" --no-restore
          rm -f publish/${{ matrix.platform }}/*.pdb

          case "${{ matrix.platform }}" in
            win-x64)   mv publish/${{ matrix.platform }}/Zipper.exe publish/${{ matrix.platform }}/zipper-win-x64.exe ;;
            linux-x64) mv publish/${{ matrix.platform }}/Zipper     publish/${{ matrix.platform }}/zipper-linux-x64 ;;
            osx-arm64) mv publish/${{ matrix.platform }}/Zipper     publish/${{ matrix.platform }}/zipper-osx-arm64 ;;
          esac
        env:
          INPUT_VERSION: ${{ inputs.release_version || inputs.version || '2.0.0' }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}

      - name: Build independent artifact metadata reader
        if: inputs.publish_mode != 'none'
        run: dotnet build tools/artifact-metadata -c Release

      - name: Accept exact self-contained executable (Unix)
        if: inputs.publish_mode != 'none' && runner.os != 'Windows'
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.release_version || inputs.version || '2.0.0' }}
          EXPECTED_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          export ZIPPER_EXECUTABLE="$PWD/publish/${{ matrix.platform }}/zipper-${{ matrix.platform }}"
          bash tests/test-published-artifact.sh

      - name: Accept exact self-contained executable (Windows)
        if: inputs.publish_mode != 'none' && runner.os == 'Windows'
        shell: cmd
        env:
          EXPECTED_VERSION: ${{ inputs.release_version || inputs.version || '2.0.0' }}
          EXPECTED_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set "ZIPPER_EXECUTABLE=%CD%\publish\win-x64\zipper-win-x64.exe"
          call tests\test-published-artifact.bat

      - name: Golden parity against shipped Linux candidate
        if: inputs.publish_mode != 'none' && matrix.coverage == true
        shell: bash
        run: ZIPPER_CLI="$PWD/publish/linux-x64/zipper-linux-x64" bash tests/goldens/run-goldens.sh

      - name: Upload self-contained binaries
        id: upload_release_artifact
        if: inputs.publish_mode == 'self-contained'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zipper-${{ matrix.platform }}
          path: publish/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 30

      - name: Record immutable uploaded artifact identity
        if: inputs.publish_mode == 'self-contained'
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload_release_artifact.outputs.artifact-id }}
          PLATFORM: ${{ matrix.platform }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          python3 -c 'import json,os; from pathlib import Path; p=os.environ["PLATFORM"]; Path(f"artifact-identity-{p}.json").write_text(json.dumps({"artifact_id":int(os.environ["ARTIFACT_ID"]),"name":f"zipper-{p}","source_sha":os.environ["SOURCE_SHA"],"run_id":os.environ["GITHUB_RUN_ID"]}))'

      - name: Upload immutable artifact receipt
        if: inputs.publish_mode == 'self-contained'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zipper-receipt-${{ matrix.platform }}
          path: artifact-identity-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 30

      # Hand the caller's `goldens` job the accepted Linux candidate. The
      # "Publish self-contained binaries" step above already produced (and
      # acceptance-tested) those bytes; a second `dotnet publish` here
      # recompiled an identical bundle (~1 min per PR) because
      # PublishSingleFile infers a RID and cannot reuse the RID-less solution
      # build. Copying keeps goldens on the accepted bytes without relying on
      # compile order between two publishes.
      - name: Stage accepted Linux candidate for goldens
        if: inputs.publish_mode == 'goldens' && matrix.coverage == true
        run: |
          set -euo pipefail
          mkdir -p publish-bin
          cp publish/linux-x64/zipper-linux-x64 publish-bin/Zipper

      - name: Upload CLI artifact for goldens (Linux)
        if: inputs.publish_mode == 'goldens' && matrix.coverage == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zipper-cli-linux
          path: publish-bin/
          if-no-files-found: error
          retention-days: 1

      - name: Upload failure diagnostics (TestResults and E2E)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-diagnostics-${{ matrix.platform }}
          path: |
            TestResults
            test_output
            results
          if-no-files-found: ignore
          retention-days: 30
