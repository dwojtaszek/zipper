# Shared CI job graph: `lint`, `runner-tests`, and the three-OS `build-and-test`
# matrix + goldens CLI publish. Both `pr.yml` and `build-and-test.yml` call this
# file, so a gate added once applies to PRs and main together — the git-identity
# divergence that reddened main CI for 15 hours (#1173) came from these two
# callers drifting apart, and this file removes that class of bug.

name: CI

on:
  workflow_call:
    inputs:
      version:
        description: >-
          Semantic version passed to `dotnet publish -p:Version=` for
          self-contained release artifacts. Empty for PR builds.
        type: string
        default: ''
      publish_mode:
        description: >-
          self-contained = publish per-RID binaries for the release job;
          goldens = publish the framework-dependent Linux CLI for goldens;
          none = publish nothing.
        type: string
        default: none

permissions:
  contents: read

env:
  # Opt-in to Node.js 24 for JS-based actions that still default to Node 20.
  # See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: eifinger/actionlint-action@1fc89649be682d16ec5cf65ea16e269eb88d3982 # v1.10.2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore (locked)
        run: dotnet restore zipper.sln --locked-mode
      - name: Lint code style
        run: dotnet format --verify-no-changes --no-restore
      - name: Validate requirement traceability
        shell: bash
        run: bash tests/validate-req-traceability.sh --strict
      - name: Validate E2E .sh/.bat parity
        shell: bash
        run: bash tests/validate-e2e-parity.sh --strict
      - name: Check for oversized files
        shell: bash
        run: |
          set -euo pipefail
          MAX_BYTES=$((500 * 1024))  # 500 KB
          oversized=$(find src -type f -size +${MAX_BYTES}c -not -name '*.json' -not -name '*.dat' -not -name '*.opt' 2>/dev/null || true)
          if [[ -n "$oversized" ]]; then
            echo "ERROR: Files exceeding ${MAX_BYTES} bytes found:" >&2
            echo "$oversized" >&2
            exit 1
          fi
          echo "No oversized files detected (limit: ${MAX_BYTES} bytes)."

      - name: Check no swallowed test output (#973)
        shell: bash
        run: |
          set -euo pipefail
          # unittest and runner.py output must never go to /dev/null —
          # #973 needed an extra PR (#974) just to read the traceback.
          # Tee to a log and cat on failure instead.
          swallowed=$(grep -rnE '(python3? -m unittest|runner\.py)[^|]*([12]?>>?|&>>?) */dev/null' tests/ tools/ .github/ 2>/dev/null || true)
          if [[ -n "$swallowed" ]]; then
            echo "ERROR: swallowed test output detected (tee to a log instead):" >&2
            echo "$swallowed" >&2
            exit 1
          fi
          echo "No swallowed test output detected."

  # `.zipper-runner/tests/` exercises the autonomous runner at its CLI,
  # subprocess, and Git boundaries. Running it here (instead of inside the .NET
  # E2E suite) keeps a runner-env failure from looking like a product failure,
  # and gives it its own checkout without the .NET build in the way.
  runner-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # Keep all three OS legs from the former E2E matrix. The runner suites
        # were previously exercised on Windows by test-typesafe-audit.bat.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize missing Git identity for CI fixtures
        shell: bash
        run: |
          # Defence in depth. The fixture suites now carry their own identity
          # (.zipper-runner/tests/gitenv.py), so this is NOT what makes them
          # pass; it covers Git work in this job outside those suites, and any
          # future suite that commits without importing gitenv. Only fills a
          # genuinely absent identity, so a configured one is kept.
          if ! git config user.name >/dev/null; then
            git config --global user.name 'github-actions[bot]'
          fi
          if ! git config user.email >/dev/null; then
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          fi

      # Tee to a log as well as the console (#973): a non-zero exit must never
      # swallow the traceback that explains it. GitHub's default `shell: bash`
      # already runs with -e -o pipefail, so a failing child fails the step.
      - name: Run zipper-runner unit tests
        shell: bash
        run: python3 -m unittest discover -s .zipper-runner/tests 2>&1 | tee zipper-runner-tests.log

  build-and-test:
    # `runner-tests` is deliberately NOT a dependency: a flaky runner suite must
    # not skip the build, unit tests, coverage gate, and E2E legs behind it.
    # The caller's `ci` job already requires every job here to succeed, so
    # gate strength is unchanged.
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            coverage: true
          - os: windows-latest
            platform: win-x64
            coverage: false
          - os: macos-latest
            platform: osx-arm64
            coverage: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize missing Git identity for CI fixtures
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Defence in depth for Git work in the full E2E suite that is not the
          # runner fixture suites (those carry their own identity). Only fills
          # genuinely absent identity, so a configured one is kept.
          if ! git config user.name >/dev/null; then
            git config --global user.name 'github-actions[bot]'
          fi
          if ! git config user.email >/dev/null; then
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          fi

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore (locked)
        run: dotnet restore zipper.sln --locked-mode

      - name: Build solution (Release, includes tests)
        run: dotnet build zipper.sln -c Release --no-restore

      # Unit tests + coverage on Linux only (single pass with the coverage collector).
      - name: Unit tests + coverage (Linux)
        if: matrix.coverage == true
        run: |
          dotnet test src/Zipper.Tests/Zipper.Tests.csproj \
            -c Release --no-build \
            --logger "console;verbosity=normal" \
            --logger "junit;LogFilePath=TestResults/test-results.xml" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults
          dotnet test src/Zipper.Analyzers.Tests/Zipper.Analyzers.Tests.csproj \
            -c Release --no-build \
            --logger "console;verbosity=normal"

      - name: Check for deprecated/vulnerable NuGet packages (Linux)
        if: matrix.coverage == true
        shell: bash
        run: |
          set -euo pipefail
          # `--unused` is not a valid `dotnet list package` option (it was a
          # silent no-op masked by `|| true`). Use the real checks instead.
          #
          # Deprecated: informational only — xunit v2 is flagged "Legacy" by
          # design, which would otherwise break every build.
          echo "::group::Deprecated packages (informational)"
          dotnet list package --deprecated --include-transitive
          echo "::endgroup::"
          # Vulnerable: hard gate. The tool prints finding rows prefixed with
          # `>`; a clean project prints "has no vulnerable packages".
          vuln=$(dotnet list package --vulnerable --include-transitive)
          echo "$vuln"
          if echo "$vuln" | grep -qE '^[[:space:]]*>'; then
            echo "ERROR: vulnerable packages detected." >&2
            exit 1
          fi
          echo "No vulnerable packages detected."

      - name: Test timing report (Linux)
        if: matrix.coverage == true
        run: |
          if [[ -f TestResults/test-results.xml ]]; then
            python3 -c "from textwrap import dedent; exec(dedent('''
            import xml.etree.ElementTree as ET
            tree = ET.parse('TestResults/test-results.xml')
            tests = [(t.get('classname',''), t.get('name',''), float(t.get('time',0))) for t in tree.iter() if t.tag == 'testcase' and float(t.get('time',0)) > 0.5]
            tests.sort(key=lambda x: -x[2])
            print('Slowest tests (>0.5s):')
            for cls, name, secs in tests[:20]:
                print(f'  {secs:.2f}s  {cls}.{name}')
            if not tests:
                print('All tests under 0.5s')
            '''))"
          fi

      - name: Coverage report + 80% gate (Linux)
        if: matrix.coverage == true
        uses: ./.github/actions/coverage-gate

      - name: Unit tests (non-Linux)
        if: matrix.coverage != true
        run: |
          dotnet test src/Zipper.Tests/Zipper.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
          dotnet test src/Zipper.Analyzers.Tests/Zipper.Analyzers.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      # Full E2E suite runs on every OS (no shortcuts)
      - name: Run full E2E suite
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./tests/run-tests.bat
          else
            bash ./tests/run-tests.sh
          fi

      # Publish self-contained per platform, for the release job on main.
      - name: Publish self-contained binaries
        if: inputs.publish_mode == 'self-contained'
        shell: bash
        run: |
          set -euo pipefail
          # -p:Version must arrive through the environment so an empty input
          # cannot produce a malformed `-p:Version=` argument. A plain string
          # (not a bash array) keeps the expansion safe on the macOS leg, where
          # /bin/bash is 3.2 and `"${empty_array[@]}"` under `set -u` aborts
          # with "unbound variable".
          VERSION_FLAG=""
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION_FLAG="-p:Version=${INPUT_VERSION}"
          fi
          # shellcheck disable=SC2086  # deliberate word-splitting: an empty
          # VERSION_FLAG must expand to zero arguments.
          dotnet publish src/Zipper.csproj -c Release -r ${{ matrix.platform }} \
            --self-contained true -o publish/${{ matrix.platform }} \
            $VERSION_FLAG --no-restore
          rm -f publish/${{ matrix.platform }}/*.pdb

          case "${{ matrix.platform }}" in
            win-x64)   mv publish/${{ matrix.platform }}/Zipper.exe publish/${{ matrix.platform }}/zipper-win-x64.exe ;;
            linux-x64) mv publish/${{ matrix.platform }}/Zipper     publish/${{ matrix.platform }}/zipper-linux-x64 ;;
            osx-arm64) mv publish/${{ matrix.platform }}/Zipper     publish/${{ matrix.platform }}/zipper-osx-arm64 ;;
          esac
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Upload self-contained binaries
        if: inputs.publish_mode == 'self-contained'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zipper-${{ matrix.platform }}
          path: publish/${{ matrix.platform }}
          retention-days: 7

      # Publish the CLI once on Linux and hand it to the caller's `goldens`
      # job as an artifact, so goldens does not re-restore + re-publish (#397).
      - name: Publish CLI for goldens (Linux)
        if: inputs.publish_mode == 'goldens' && matrix.coverage == true
        run: dotnet publish src/Zipper.csproj -c Release -o ./publish-bin --no-restore

      - name: Upload CLI artifact for goldens (Linux)
        if: inputs.publish_mode == 'goldens' && matrix.coverage == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zipper-cli-linux
          path: publish-bin/
          retention-days: 1
