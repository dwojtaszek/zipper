name: Perf Baseline Refresh

on:
  schedule:
    - cron: '0 4 * * 1'  # Monday 04:00 UTC
  workflow_dispatch:
    inputs:
      justification:
        description: 'Justification for baseline refresh (required if increasing baselines)'
        required: false
        default: ''

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Publish Release binary
        run: dotnet publish src/Zipper.csproj -c Release -o publish-bin

      - name: Run perf measurements (5 runs, take median)
        run: |
          mkdir -p results
          for i in $(seq 1 5); do
            ./tests/perf/measure.sh ./publish-bin/Zipper --seed 42 > "results/run_${i}.json"
          done

      - name: Check drift and update baselines
        id: drift
        env:
          JUSTIFICATION: ${{ github.event.inputs.justification || '' }}
        run: python3 .github/scripts/perf-baseline-refresh.py results tests/perf/baselines.json --seed 42

      - name: Upload measurement artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: perf-baseline-measurements
          path: results/

      - name: Require human-scoped token for PR branch push
        if: steps.drift.outputs.drifted == 'true'
        shell: bash
        run: |
          # A branch pushed with the default GITHUB_TOKEN makes the PR author
          # github-actions[bot]. GitHub holds workflow runs on such PRs at
          # 'action_required', so PR Checks never runs, ci-gate never posts, and
          # the PR silently cannot merge (observed on PR #1187). A PAT scoped
          # contents:pull-requests:write pushes as a human, so checks run.
          # Fail loudly instead of re-creating an unmergeable PR.
          if [ -z "${PERF_BASELINE_TOKEN}" ]; then
            echo "::error file=.github/workflows/perf-baseline-refresh.yml::PERF_BASELINE_TOKEN secret is not configured."
            echo "A baselines PR cannot be opened without it: the default GITHUB_TOKEN would be held at 'action_required' and never become mergeable."
            echo "Create a fine-grained PAT with contents:pull-requests:write for dwojtraszek/zipper and store it as the PERF_BASELINE_TOKEN repository secret."
            exit 1
          fi
        env:
          PERF_BASELINE_TOKEN: ${{ secrets.PERF_BASELINE_TOKEN }}

      - name: Create Pull Request
        if: steps.drift.outputs.drifted == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: perf/baseline-refresh-${{ github.run_id }}
          title: 'chore: refresh perf baselines'
          body-path: results/pr_body.md
          labels: perf,automated
          commit-message: 'chore: refresh perf baselines'
          token: ${{ secrets.PERF_BASELINE_TOKEN }}
