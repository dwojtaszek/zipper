# TypeSafe audit side check (#955 foundation slice).
# Advisory only: findings, outages, and rate limits never block merge and never
# replace deterministic build/format/test/coverage/security gates.
name: typesafe-audit

on:
  pull_request:
    branches:
      - main
    paths:
      - "Requirements.md"
      - "docs/**"
      - "src/**"
      - "tests/**"
      - "tools/typesafe-audit/**"
      - ".github/workflows/typesafe-audit.yml"
  schedule:
    # Weekly full audit, Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "Audit scope (full audits every active requirement in bounded batches)"
        type: choice
        options:
          - changed
          - full
        default: changed

permissions:
  contents: read

concurrency:
  group: typesafe-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check secret availability (fork PRs skip neutrally)
        id: secret
        env:
          HAS_KEY: ${{ secrets.TYPESAFE_API_KEY != '' }}
        run: echo "available=$HAS_KEY" >> "$GITHUB_OUTPUT"

      - name: Neutral skip summary
        if: steps.secret.outputs.available != 'true'
        run: |
          {
            echo "## TypeSafe audit skipped"
            echo ""
            echo "TYPESAFE_API_KEY is not available in this context"
            echo "(fork pull requests never receive repository secrets)."
            echo "No audit was executed and nothing was uploaded."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: steps.secret.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: changed-section extraction diffs against the PR base SHA.
          fetch-depth: 0

      - name: Run TypeSafe audit (advisory)
        if: steps.secret.outputs.available == 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          set -o pipefail
          # Foundation slice: audit the fixed sample scope with the example question
          # definition.
          python3 tools/typesafe-audit/runner.py \
            --mode live \
            --files tools/typesafe-audit/questions/files-sample.list \
            --questions tools/typesafe-audit/questions/example.json \
            --json-out results/typesafe-audit/report.json \
            --md-out results/typesafe-audit/report.md \
            --summary-out "$GITHUB_STEP_SUMMARY" || {
              code=$?
              # Advisory: remote failures (3) and input errors (2) never block.
              if [ "$code" -eq 1 ]; then
                echo "### TypeSafe audit findings (advisory)" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "### TypeSafe audit unavailable (exit $code; advisory)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            }

      - name: Run requirements semantic audit (advisory, #956)
        if: steps.secret.outputs.available == 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          # PRs audit changed sections; schedule and manual dispatch run full mode
          # (schedule has no base to diff against; dispatch honors mode=full).
          JSON_OUT=results/typesafe-audit/requirements.json
          MD_OUT=results/typesafe-audit/requirements.md
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MODE_ARGS=(--base "${PR_BASE:-HEAD}")
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.mode }}" != "full" ]; then
            MODE_ARGS=(--base HEAD~1)
          else
            MODE_ARGS=(--full)
          fi
          python3 tools/typesafe-audit/checks/requirements/run_check.py \
            --mode live \
            "${MODE_ARGS[@]}" \
            --json-out "$JSON_OUT" \
            --md-out "$MD_OUT" \
            --summary-out "$GITHUB_STEP_SUMMARY" || {
              # Advisory: this check never blocks (see run_check.py exit-code contract).
              echo "### Requirements audit advisory result (exit $?)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            }

      - name: Run semantic traceability audit (advisory, #957)
        if: steps.secret.outputs.available == 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          # Complements (never replaces) the deterministic strict traceability gate.
          bash tests/validate-req-traceability.sh --strict
          # PRs audit changed requirements/mappings/tests; schedule and manual
          # dispatch run full mode over every active non-exempt requirement.
          JSON_OUT=results/typesafe-audit/traceability.json
          MD_OUT=results/typesafe-audit/traceability.md
          if [ -n "${PR_BASE:-}" ]; then
            MODE_ARGS=(--base "${PR_BASE}")
          else
            MODE_ARGS=(--full)
          fi
          python3 tools/typesafe-audit/checks/traceability/run_check.py \
            --mode live \
            "${MODE_ARGS[@]}" \
            --json-out "$JSON_OUT" \
            --md-out "$MD_OUT" \
            --summary-out "$GITHUB_STEP_SUMMARY" || {
              # Advisory: this check never blocks (see run_check.py exit-code contract).
              echo "### Traceability audit advisory result (exit $?)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            }

      - name: Run architecture seam lint (advisory)
        if: steps.secret.outputs.available == 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          # Critical Rule 5 seam judgments: only runs a model call when the
          # diff touches src/LoadFiles/** or docs/architecture.md.
          if [ -n "${PR_BASE:-}" ]; then
            BASE_ARGS=(--base "${PR_BASE}")
          else
            BASE_ARGS=(--base HEAD~1)
          fi
          python3 tools/typesafe-audit/checks/architecture/run_check.py \
            --mode live \
            "${BASE_ARGS[@]}" \
            --json-out results/typesafe-audit/architecture.json \
            --md-out results/typesafe-audit/architecture.md \
            --summary-out "$GITHUB_STEP_SUMMARY" || {
              # Advisory: this check never blocks (see run_check.py exit-code contract).
              echo "### Architecture lint advisory result (exit $?)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            }

      - name: Upload audit artifacts
        if: steps.secret.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: typesafe-audit-report
          path: |
            results/typesafe-audit/report.json
            results/typesafe-audit/report.md
            results/typesafe-audit/requirements.json
            results/typesafe-audit/requirements.md
            results/typesafe-audit/traceability.json
            results/typesafe-audit/traceability.md
            results/typesafe-audit/architecture.json
            results/typesafe-audit/architecture.md
            results/typesafe-audit/pr-spec.json
            results/typesafe-audit/pr-spec.md
          retention-days: 7
          if-no-files-found: ignore

  pr-spec-review:
    # PR specification compliance side check (#958). Independent job: a TypeSafe
    # service failure here can never cancel build/test or other audits.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Check secret availability (skips neutrally when absent)
        id: secret
        env:
          HAS_KEY: ${{ secrets.TYPESAFE_API_KEY != '' }}
        run: echo "available=$HAS_KEY" >> "$GITHUB_OUTPUT"

      - name: Neutral skip summary
        if: steps.secret.outputs.available != 'true'
        run: |
          {
            echo "## PR spec review skipped"
            echo ""
            echo "TYPESAFE_API_KEY is not available in this context; nothing was executed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: steps.secret.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Offline corpus evaluation (recorded responses)
        if: steps.secret.outputs.available == 'true'
        run: |
          set -o pipefail
          FIXTURES=$(mktemp -d)
          python3 tools/typesafe-audit/checks/pr-spec/record_corpus_fixtures.py "$FIXTURES"
          python3 tools/typesafe-audit/checks/pr-spec/run_check.py \
            --corpus tests/typesafe-audit-fixtures/pr-spec \
            --mode fixture --fixture-dir "$FIXTURES" \
            --json-out results/typesafe-audit/pr-spec-corpus.json \
            --md-out results/typesafe-audit/pr-spec-corpus.md

      - name: Collect PR context
        if: steps.secret.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 tools/typesafe-audit/checks/pr-spec/collect_pr.py \
            "$PR_NUMBER" results/typesafe-audit/pr-spec-input.json

      - name: Run PR spec review (advisory)
        if: steps.secret.outputs.available == 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          set -o pipefail
          python3 tools/typesafe-audit/checks/pr-spec/run_check.py \
            --mode live \
            --pr-json results/typesafe-audit/pr-spec-input.json \
            --json-out results/typesafe-audit/pr-spec.json \
            --md-out results/typesafe-audit/pr-spec.md \
            --summary-out "$GITHUB_STEP_SUMMARY" || {
              # Advisory: this check never blocks (see run_check.py exit-code contract).
              echo "### PR spec review advisory result (exit $?)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            }

      - name: Upload PR spec review artifacts
        if: steps.secret.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-spec-review-report
          path: |
            results/typesafe-audit/pr-spec-corpus.json
            results/typesafe-audit/pr-spec-corpus.md
            results/typesafe-audit/pr-spec.json
            results/typesafe-audit/pr-spec.md
          retention-days: 7
          if-no-files-found: ignore
