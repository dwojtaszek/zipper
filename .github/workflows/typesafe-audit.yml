# TypeSafe audit side check (#955 foundation slice).
# Advisory only: findings, outages, and rate limits never block merge and never
# replace deterministic build/format/test/coverage/security gates.
name: typesafe-audit

on:
  pull_request:
    branches:
      - main
    paths:
      - "Requirements.md"
      - "docs/**"
      - "src/**"
      - "tests/**"
      - "tools/typesafe-audit/**"
      - ".github/workflows/typesafe-audit.yml"
  schedule:
    # Weekly full audit, Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "Audit scope (full audits every active requirement in bounded batches)"
        type: choice
        options:
          - changed
          - full
        default: changed

permissions:
  contents: read

concurrency:
  group: typesafe-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      assurance_status: ${{ steps.assurance-result.outputs.status || steps.secret-assurance.outputs.status }}
      assurance_executed: ${{ steps.assurance-result.outputs.executed || steps.secret-assurance.outputs.executed }}
      assurance_reason: ${{ steps.assurance-result.outputs.reason || steps.secret-assurance.outputs.reason }}
      assurance_json: ${{ steps.assurance-result.outputs.json || steps.secret-assurance.outputs.json }}
    strategy:
      # Bound aggregate API traffic; pr-spec-review remains a separate job.
      fail-fast: false
      max-parallel: 2
      matrix:
        check:
          - foundation
          - requirements
          - traceability
          - architecture
          - domain-language
    steps:
      - name: Check secret availability (fork PRs skip neutrally)
        id: secret
        env:
          HAS_KEY: ${{ secrets.TYPESAFE_API_KEY != '' }}
        run: echo "available=$HAS_KEY" >> "$GITHUB_OUTPUT"

      - name: Neutral skip summary
        id: secret-assurance
        if: steps.secret.outputs.available != 'true'
        run: |
          mkdir -p results/typesafe-audit
          cat > results/typesafe-audit/assurance-result.json <<EOF
          {
            "executed": false,
            "scope": "${{ matrix.check }}",
            "sha": "${{ github.sha }}",
            "status": "unavailable",
            "reason": "missing_typesafe_api_key"
          }
          EOF
          echo "status=unavailable" >> "$GITHUB_OUTPUT"
          echo "executed=false" >> "$GITHUB_OUTPUT"
          echo "reason=missing_typesafe_api_key" >> "$GITHUB_OUTPUT"
          echo "scope=${{ matrix.check }}" >> "$GITHUB_OUTPUT"
          echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "json={\"executed\":false,\"scope\":\"${{ matrix.check }}\",\"sha\":\"${{ github.sha }}\",\"status\":\"unavailable\",\"reason\":\"missing_typesafe_api_key\"}" >> "$GITHUB_OUTPUT"
          {
            echo "## TypeSafe audit skipped"
            echo ""
            echo "TYPESAFE_API_KEY is not available in this context"
            echo "(fork pull requests never receive repository secrets)."
            echo "No audit was executed."
            echo ""
            echo "### Scheduled Assurance Result"
            echo '```json'
            cat results/typesafe-audit/assurance-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: steps.secret.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: changed-section extraction diffs against the PR base SHA.
          fetch-depth: 0

      - name: Run TypeSafe audit (advisory)
        if: steps.secret.outputs.available == 'true' && matrix.check == 'foundation'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          set -o pipefail
          # Foundation slice: audit the fixed sample scope with the example question
          # definition.
          python3 tools/typesafe-audit/runner.py \
            --mode live \
            --files tools/typesafe-audit/questions/files-sample.list \
            --questions tools/typesafe-audit/questions/example.json \
            --json-out results/typesafe-audit/report.json \
            --md-out results/typesafe-audit/report.md \
            --summary-out "$GITHUB_STEP_SUMMARY" || {
              code=$?
              # Advisory: remote failures (3) and input errors (2) never block.
              if [ "$code" -eq 1 ]; then
                echo "### TypeSafe audit findings (advisory)" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "### TypeSafe audit unavailable (exit $code; advisory)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            }

      - name: Run requirements semantic audit (advisory, #956)
        if: steps.secret.outputs.available == 'true' && matrix.check == 'requirements'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          # PRs audit changed sections; schedule and manual dispatch run full mode
          # (schedule has no base to diff against; dispatch honors mode=full).
          JSON_OUT=results/typesafe-audit/requirements.json
          MD_OUT=results/typesafe-audit/requirements.md
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MODE_ARGS=(--base "${PR_BASE:-HEAD}")
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.mode }}" != "full" ]; then
            MODE_ARGS=(--base HEAD~1)
          else
            MODE_ARGS=(--full)
          fi
          python3 tools/typesafe-audit/checks/requirements/run_check.py \
            --mode live \
            "${MODE_ARGS[@]}" \
            --json-out "$JSON_OUT" \
            --md-out "$MD_OUT" \
            --summary-out "$GITHUB_STEP_SUMMARY" || {
              # Advisory: this check never blocks (see run_check.py exit-code contract).
              echo "### Requirements audit advisory result (exit $?)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            }

      - name: Run semantic traceability audit (advisory, #957)
        if: steps.secret.outputs.available == 'true' && matrix.check == 'traceability'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          # Complements (never replaces) the deterministic strict traceability gate.
          bash tests/validate-req-traceability.sh --strict
          # PRs audit changed requirements/mappings/tests; schedule and manual
          # dispatch run full mode over every active non-exempt requirement.
          JSON_OUT=results/typesafe-audit/traceability.json
          MD_OUT=results/typesafe-audit/traceability.md
          if [ -n "${PR_BASE:-}" ]; then
            MODE_ARGS=(--base "${PR_BASE}")
          else
            MODE_ARGS=(--full)
          fi
          python3 tools/typesafe-audit/checks/traceability/run_check.py \
            --mode live \
            "${MODE_ARGS[@]}" \
            --json-out "$JSON_OUT" \
            --md-out "$MD_OUT" \
            --summary-out "$GITHUB_STEP_SUMMARY" || {
              # Advisory: this check never blocks (see run_check.py exit-code contract).
              echo "### Traceability audit advisory result (exit $?)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            }

      - name: Run architecture seam lint (advisory)
        if: steps.secret.outputs.available == 'true' && matrix.check == 'architecture'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          # Critical Rule 5 seam judgments: only runs a model call when the
          # diff touches src/LoadFiles/** or docs/architecture.md.
          if [ -n "${PR_BASE:-}" ]; then
            BASE_ARGS=(--base "${PR_BASE}")
          else
            BASE_ARGS=(--base HEAD~1)
          fi
          python3 tools/typesafe-audit/checks/architecture/run_check.py \
            --mode live \
            "${BASE_ARGS[@]}" \
            --json-out results/typesafe-audit/architecture.json \
            --md-out results/typesafe-audit/architecture.md \
            --summary-out "$GITHUB_STEP_SUMMARY" || {
              # Advisory: this check never blocks (see run_check.py exit-code contract).
              echo "### Architecture lint advisory result (exit $?)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            }

      - name: Run domain language lint (advisory)
        if: steps.secret.outputs.available == 'true' && matrix.check == 'domain-language'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          if [ -n "${PR_BASE:-}" ]; then
            BASE_ARGS=(--base "${PR_BASE}")
          else
            BASE_ARGS=(--base HEAD~1)
          fi
          python3 tools/typesafe-audit/checks/domain_language/run_check.py \
            --mode live \
            "${BASE_ARGS[@]}" \
            --json-out results/typesafe-audit/domain-language.json \
            --md-out results/typesafe-audit/domain-language.md \
            --summary-out "$GITHUB_STEP_SUMMARY" || {
              # Advisory: this check never blocks (see run_check.py exit-code contract).
              echo "### Domain language lint advisory result (exit $?)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            }

      - name: Emit audit assurance result
        id: assurance-result
        if: always() && steps.secret.outputs.available == 'true'
        shell: bash
        env:
          CHECK: ${{ matrix.check }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p results/typesafe-audit
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          check = os.environ.get("CHECK", "")
          sha = os.environ.get("COMMIT_SHA", "")

          target_files = {
              "foundation": "results/typesafe-audit/report.json",
              "requirements": "results/typesafe-audit/requirements.json",
              "traceability": "results/typesafe-audit/traceability.json",
              "architecture": "results/typesafe-audit/architecture.json",
              "domain-language": "results/typesafe-audit/domain-language.json",
          }

          expected_file = Path(target_files.get(check, f"results/typesafe-audit/{check}.json"))
          if expected_file.exists():
              executed = True
              status = "executed"
              reason = "completed"
          else:
              executed = False
              status = "unavailable"
              reason = "remote_failure_or_unmet_preconditions"

          result = {
              "executed": executed,
              "scope": check,
              "sha": sha,
              "status": status,
              "reason": reason,
          }

          os.makedirs("results/typesafe-audit", exist_ok=True)
          result_path = "results/typesafe-audit/assurance-result.json"
          with open(result_path, "w", encoding="utf-8") as f:
              json.dump(result, f, indent=2)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("### Scheduled Assurance Result\n\n```json\n" + json.dumps(result, indent=2) + "\n```\n\n")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"status={status}\n")
              f.write(f"executed={'true' if executed else 'false'}\n")
              f.write(f"reason={reason}\n")
              f.write(f"scope={check}\n")
              f.write(f"sha={sha}\n")
              f.write(f"json={json.dumps(result)}\n")
          PY

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: typesafe-audit-report-${{ matrix.check }}
          path: results/typesafe-audit/
          retention-days: 7
          if-no-files-found: warn

  pr-spec-review:
    # PR specification compliance side check (#958). Independent job: a TypeSafe
    # service failure here can never cancel build/test or other audits.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      assurance_status: ${{ steps.assurance-result.outputs.status || steps.secret-assurance.outputs.status }}
      assurance_executed: ${{ steps.assurance-result.outputs.executed || steps.secret-assurance.outputs.executed }}
      assurance_reason: ${{ steps.assurance-result.outputs.reason || steps.secret-assurance.outputs.reason }}
      assurance_json: ${{ steps.assurance-result.outputs.json || steps.secret-assurance.outputs.json }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Check secret availability (skips neutrally when absent)
        id: secret
        env:
          HAS_KEY: ${{ secrets.TYPESAFE_API_KEY != '' }}
        run: echo "available=$HAS_KEY" >> "$GITHUB_OUTPUT"

      - name: Neutral skip summary
        id: secret-assurance
        if: steps.secret.outputs.available != 'true'
        run: |
          mkdir -p results/typesafe-audit
          cat > results/typesafe-audit/assurance-result.json <<EOF
          {
            "executed": false,
            "scope": "pr-spec",
            "sha": "${{ github.sha }}",
            "status": "unavailable",
            "reason": "missing_typesafe_api_key"
          }
          EOF
          echo "status=unavailable" >> "$GITHUB_OUTPUT"
          echo "executed=false" >> "$GITHUB_OUTPUT"
          echo "reason=missing_typesafe_api_key" >> "$GITHUB_OUTPUT"
          echo "scope=pr-spec" >> "$GITHUB_OUTPUT"
          echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "json={\"executed\":false,\"scope\":\"pr-spec\",\"sha\":\"${{ github.sha }}\",\"status\":\"unavailable\",\"reason\":\"missing_typesafe_api_key\"}" >> "$GITHUB_OUTPUT"
          {
            echo "## PR spec review skipped"
            echo ""
            echo "TYPESAFE_API_KEY is not available in this context; nothing was executed."
            echo ""
            echo "### Scheduled Assurance Result"
            echo '```json'
            cat results/typesafe-audit/assurance-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: steps.secret.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Offline corpus evaluation (recorded responses)
        if: steps.secret.outputs.available == 'true'
        run: |
          set -o pipefail
          FIXTURES=$(mktemp -d)
          python3 tools/typesafe-audit/checks/pr-spec/record_corpus_fixtures.py "$FIXTURES"
          python3 tools/typesafe-audit/checks/pr-spec/run_check.py \
            --corpus tests/typesafe-audit-fixtures/pr-spec \
            --mode fixture --fixture-dir "$FIXTURES" \
            --json-out results/typesafe-audit/pr-spec-corpus.json \
            --md-out results/typesafe-audit/pr-spec-corpus.md

      - name: Collect PR context
        if: steps.secret.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 tools/typesafe-audit/checks/pr-spec/collect_pr.py \
            "$PR_NUMBER" results/typesafe-audit/pr-spec-input.json

      - name: Run PR spec review (advisory)
        if: steps.secret.outputs.available == 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          set -o pipefail
          python3 tools/typesafe-audit/checks/pr-spec/run_check.py \
            --mode live \
            --pr-json results/typesafe-audit/pr-spec-input.json \
            --json-out results/typesafe-audit/pr-spec.json \
            --md-out results/typesafe-audit/pr-spec.md \
            --summary-out "$GITHUB_STEP_SUMMARY" || {
              # Advisory: this check never blocks (see run_check.py exit-code contract).
              echo "### PR spec review advisory result (exit $?)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            }

      - name: Emit PR spec assurance result
        id: assurance-result
        if: always() && steps.secret.outputs.available == 'true'
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p results/typesafe-audit
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          sha = os.environ.get("COMMIT_SHA", "")
          spec_json = Path("results/typesafe-audit/pr-spec.json")

          if spec_json.exists():
              executed = True
              status = "executed"
              reason = "completed"
          else:
              executed = False
              status = "unavailable"
              reason = "remote_failure_or_missing_spec"

          result = {
              "executed": executed,
              "scope": "pr-spec",
              "sha": sha,
              "status": status,
              "reason": reason,
          }

          os.makedirs("results/typesafe-audit", exist_ok=True)
          result_path = "results/typesafe-audit/assurance-result.json"
          with open(result_path, "w", encoding="utf-8") as f:
              json.dump(result, f, indent=2)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("### Scheduled Assurance Result\n\n```json\n" + json.dumps(result, indent=2) + "\n```\n\n")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"status={status}\n")
              f.write(f"executed={'true' if executed else 'false'}\n")
              f.write(f"reason={reason}\n")
              f.write("scope=pr-spec\n")
              f.write(f"sha={sha}\n")
              f.write(f"json={json.dumps(result)}\n")
          PY

      - name: Upload PR spec review artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-spec-review-report
          path: |
            results/typesafe-audit/pr-spec-corpus.json
            results/typesafe-audit/pr-spec-corpus.md
            results/typesafe-audit/pr-spec.json
            results/typesafe-audit/pr-spec.md
            results/typesafe-audit/assurance-result.json
          retention-days: 7
          if-no-files-found: warn
