name: PR Checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Opt-in to Node.js 24 for JS-based actions that still default to Node 20.
  # See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  docs-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      only_docs: ${{ steps.check.outputs.only_docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          # Step 1: fetch the list of changed files; propagate a genuine
          # `git diff` failure (missing SHA, corrupt object, etc.) so we
          # never silently declare a failed diff as "docs-only".
          files=$(git diff --name-only "$base" "$head")

          if [[ -z "$files" ]]; then
            echo "No files changed between $base and $head; treating as non-docs to be safe."
            echo "only_docs=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Step 2: every changed file must match a docs pattern to qualify
          # as docs-only. Count matches explicitly (no `|| true` masking).
          total=$(printf '%s\n' "$files" | grep -c . || true)
          docs=$(printf '%s\n' "$files" \
              | grep -c -E '(^|/)(docs/|CHANGELOG(\.md)?$|.*\.(md|markdown)$)' || true)

          if [[ "$total" -gt 0 && "$docs" -eq "$total" ]]; then
            echo "Docs-only PR detected ($total files, all docs); skipping full build and test matrix."
            echo "only_docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "Non-docs change detected ($docs of $total files are docs); running full PR pipeline."
            echo "only_docs=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate requirement traceability
        if: steps.check.outputs.only_docs == 'true'
        shell: bash
        run: bash tests/validate-req-traceability.sh --strict
      - name: Setup .NET for DocsDriftTests
        if: steps.check.outputs.only_docs == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Run DocsDriftTests
        if: steps.check.outputs.only_docs == 'true'
        shell: bash
        run: dotnet test src/Zipper.Tests/Zipper.Tests.csproj --filter "FullyQualifiedName~DocsDriftTests" --logger "console;verbosity=normal"

  # Single source of truth for the shared gates (lint, runner-tests,
  # version-metadata, the three-OS build-and-test matrix, and the accepted
  # Linux candidate staged for the `goldens` job). See ci.yml.
  # A PR may edit ci.yml itself: `pull_request` checks out the PR head with a
  # read-only token, so a change is validated by the version it ships with.
  ci:
    needs: docs-only
    if: needs.docs-only.outputs.only_docs != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      publish_mode: goldens

  goldens:
    needs: [docs-only, ci]
    if: needs.docs-only.outputs.only_docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runtime only — the artifact is the self-contained Linux candidate
      # staged by ci.yml; no restore/build here.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download CLI artifact (built by the Linux build-and-test leg)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: zipper-cli-linux
          path: publish-bin

      - name: Run golden scenarios
        run: |
          chmod +x ./publish-bin/Zipper ./tests/goldens/run-goldens.sh
          ZIPPER_CLI="$(pwd)/publish-bin/Zipper" bash ./tests/goldens/run-goldens.sh

  # Aggregate merge gate. Branch protection requires exactly this check.
  # It always runs (even on docs-only PRs where the other jobs are
  # skipped), so the required check context is always posted. It fails
  # unless every needed job is proven to have passed or been deliberately
  # skipped (docs-only fast path).
  ci-gate:
    needs: [docs-only, ci, goldens]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Evaluate required jobs
        shell: bash
        env:
          # `needs` as a whole, so a failure can name the job that did not pass.
          # Passed through the environment rather than interpolated into the
          # script: job outputs can contain quotes, and a `${{ }}` value spliced
          # into a shell string would then be re-parsed as code.
          REQUIRED_JOBS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'EVALUATE'
          import json
          import os
          import sys

          # An allowlist, not a blocklist, and one entry per needed job.
          #
          # A blocklist of failure names cannot work here: GitHub reports results
          # outside its documented success/failure/cancelled/skipped set. On PR
          # #1377 the caller's reusable `ci` workflow was torn down mid-run and
          # reported `abandoned`; the old gate's grep for "failure"/"cancelled"
          # matched nothing, so the required check went green while the run's own
          # conclusion was `failure` and its macOS leg never executed a step.
          #
          # `skipped` is allowed only where a skip is the documented outcome, and
          # only when the docs-only fast path is what caused it. In that same
          # #1377 run `goldens` was itself `skipped` -- not because the PR was
          # docs-only, but because its `ci` dependency was abandoned -- so a bare
          # "skipped is fine" would have accepted the sibling of the very result
          # this gate exists to reject. `docs-only` has no `if:`, so a `skipped`
          # there means the run never really executed.
          ALLOWED = {
              "docs-only": {"success"},
              "ci": {"success", "skipped"},
              "goldens": {"success", "skipped"},
          }

          try:
              needs = json.loads(os.environ["REQUIRED_JOBS_JSON"])
          except (KeyError, ValueError) as e:
              print(f"::error::Could not read the required job results: {e} — merge blocked.")
              sys.exit(1)

          if not isinstance(needs, dict) or not needs:
              print("::error::No required job results to evaluate — merge blocked.")
              sys.exit(1)

          # The payload is echoed on every path: it is what made #1377
          # diagnosable, and it is the only record of what the gate actually saw.
          print(f"Required job results: {json.dumps(needs, sort_keys=True)}")

          def result_of(name):
              value = needs.get(name)
              return value.get("result") if isinstance(value, dict) else value

          def outputs_of(name):
              value = needs.get(name)
              return value.get("outputs", {}) if isinstance(value, dict) else {}

          only_docs = outputs_of("docs-only").get("only_docs")

          failed = []
          # A job absent from the payload yields a None result here and is
          # rejected by the same allowlist check, so a missing result cannot pass
          # by omission.
          for name, allowed in ALLOWED.items():
              result = result_of(name)
              if result not in allowed:
                  failed.append((name, result, "allowed here: " + "/".join(sorted(allowed))))
              elif result == "skipped" and only_docs != "true":
                  failed.append((name, result, "skipped without a docs-only fast path"))
          for name in sorted(set(needs) - set(ALLOWED)):
              failed.append((name, result_of(name), "not a job this gate knows how to judge"))

          if failed:
              for name, result, why in sorted(failed, key=lambda item: item[0]):
                  print(f"::error::{name} did not pass (result: {result!r}; {why}) — merge blocked.")
              sys.exit(1)

          print("All required jobs passed, or were skipped on the docs-only fast path.")
          EVALUATE
