name: PR Checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Opt-in to Node.js 24 for JS-based actions that still default to Node 20.
  # See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  docs-only:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      only_docs: ${{ steps.check.outputs.only_docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          # Step 1: fetch the list of changed files; propagate a genuine
          # `git diff` failure (missing SHA, corrupt object, etc.) so we
          # never silently declare a failed diff as "docs-only".
          files=$(git diff --name-only "$base" "$head")

          if [[ -z "$files" ]]; then
            echo "No files changed between $base and $head; treating as non-docs to be safe."
            echo "only_docs=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Step 2: every changed file must match a docs pattern to qualify
          # as docs-only. Count matches explicitly (no `|| true` masking).
          total=$(printf '%s\n' "$files" | grep -c . || true)
          docs=$(printf '%s\n' "$files" \
              | grep -c -E '(^|/)(docs/|CHANGELOG(\.md)?$|.*\.(md|markdown)$)' || true)

          if [[ "$total" -gt 0 && "$docs" -eq "$total" ]]; then
            echo "Docs-only PR detected ($total files, all docs); skipping build and tests."
            echo "only_docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "Non-docs change detected ($docs of $total files are docs); running full PR pipeline."
            echo "only_docs=false" >> "$GITHUB_OUTPUT"
          fi

  # Single source of truth for the shared gates (lint, runner-tests, the
  # three-OS build-and-test matrix, goldens CLI publish). See ci.yml.
  # A PR may edit ci.yml itself: `pull_request` checks out the PR head with a
  # read-only token, so a change is validated by the version it ships with.
  ci:
    needs: docs-only
    if: needs.docs-only.outputs.only_docs != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      publish_mode: goldens

  goldens:
    needs: [docs-only, ci]
    if: needs.docs-only.outputs.only_docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runtime only — the binary is framework-dependent; no restore/build here.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download CLI artifact (built by the Linux build-and-test leg)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: zipper-cli-linux
          path: publish-bin

      - name: Run golden scenarios
        run: |
          chmod +x ./publish-bin/Zipper ./tests/goldens/run-goldens.sh
          ZIPPER_CLI="$(pwd)/publish-bin/Zipper" bash ./tests/goldens/run-goldens.sh

  # Aggregate merge gate. Branch protection requires exactly this check.
  # It always runs (even on docs-only PRs where the other jobs are
  # skipped), so the required check context is always posted; it fails
  # if any needed job failed or was cancelled. Skipped jobs (docs-only
  # fast path) do not fail the gate.
  ci-gate:
    needs: [docs-only, ci, goldens]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Evaluate required jobs
        shell: bash
        run: |
          set -euo pipefail
          results='${{ toJSON(needs.*.result) }}'
          echo "Job results: $results"
          if echo "$results" | grep -qE '"(failure|cancelled)"'; then
            echo "::error::A required PR job failed or was cancelled — merge blocked."
            exit 1
          fi
          echo "All required jobs passed or were skipped (docs-only)."
