name: Build and Test

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      source_sha:
        description: Existing release intent source SHA to recover (empty for current main)
        type: string
        default: ''
      release_tag:
        description: Existing intent tag, required only when a source SHA has multiple intents
        type: string
        default: ''

concurrency:
  # One allocator/publisher across main, manual tags, and recovery. Publication
  # must not be cancelled between creating the tag and completing the release.
  group: zipper-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Opt-in to Node.js 24 for JS-based actions that still default to Node 20.
  # See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_version: ${{ steps.version.outputs.release_version }}
      tag: ${{ steps.version.outputs.tag }}
      prev_tag: ${{ steps.version.outputs.prev_tag }}
      release_id: ${{ steps.version.outputs.release_id }}
      artifact_run: ${{ steps.version.outputs.artifact_run }}
      artifact_ids: ${{ steps.version.outputs.artifact_ids }}
      skip: ${{ steps.version.outputs.skip }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Identify source
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Reserve or resume release intent
        id: version
        shell: bash
        run: |
          flags=()
          if [[ "$RECOVER" == "true" ]]; then flags+=("--recover"); fi
          if [[ -n "$INTENT_TAG" ]]; then flags+=("--intent-tag" "$INTENT_TAG"); fi
          python3 .github/scripts/release.py prepare --sha "$SOURCE_SHA" "${flags[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RECOVER: ${{ inputs.source_sha != '' }}
          INTENT_TAG: ${{ inputs.release_tag }}

  # Single source of truth for the shared gates (lint, runner-tests, the
  # three-OS build-and-test matrix). See ci.yml. Main pushes always run it:
  # unlike pr.yml, the version and the self-contained publish are supplied.
  ci:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      release_version: ${{ needs.prepare.outputs.release_version }}
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      publish_mode: self-contained

  tag-and-release:
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: needs.prepare.outputs.skip != 'true'
    permissions:
      contents: write
      actions: read
      pull-requests: read
      models: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.prepare.outputs.artifact_ids == ''
        with:
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.artifact_run || github.run_id }}
          pattern: zipper-*

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.prepare.outputs.artifact_ids != ''
        with:
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.artifact_run }}
          artifact-ids: ${{ needs.prepare.outputs.artifact_ids }}

      - name: Extract PR Release Notes
        id: pr_notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ needs.prepare.outputs.source_sha }}
          # Passed via env to avoid template injection in bash (step output could contain $() etc.)
          PREV_TAG_FROM_STEP: ${{ needs.prepare.outputs.prev_tag }}
        shell: bash
        run: |
          set -eo pipefail

          # Try commits API (works for merge + squash strategies).
          # Content stays in a file — never interpolated into shell (injection guard).
          gh api "repos/${REPO}/commits/${COMMIT_SHA}/pulls" \
            --jq '(.[0] // {}) | .body // ""' > /tmp/pr_body.txt 2>/dev/null || true

          # Rebase-merge fallback: rebased commits have new SHAs not tracked by the
          # commits API. Extract PR number from PR-specific patterns only — avoiding
          # issue references like "Fixes #123" which use the same #N syntax.
          if [[ ! -s /tmp/pr_body.txt ]]; then
            SUBJECT=$(git log -1 --format="%s")
            BODY=$(git log -1 --format="%b")
            # Squash pattern: "My PR title (#42)" — number in trailing parens
            PR_NUM=$(printf '%s\n' "$SUBJECT" | sed -nE 's/.*\(#([0-9]+)\)$/\1/p' | head -1 || true)
            if [[ -z "$PR_NUM" ]]; then
              # Merge pattern: "Merge pull request #42 from ..."
              PR_NUM=$(printf '%s\n%s\n' "$SUBJECT" "$BODY" | sed -nE 's/^Merge pull request #([0-9]+).*/\1/p' | head -1 || true)
            fi
            if [[ -n "$PR_NUM" ]]; then
              gh api "repos/${REPO}/pulls/${PR_NUM}" \
                --jq '.body // ""' > /tmp/pr_body.txt 2>/dev/null || true
            fi
          fi

          # Extract ## Release Notes section. awk state machine strips multi-line
          # HTML comments (<!-- ... -->) including their interior lines.
          # grep exits 1 on zero matches — || true is required, not defensive noise.
          NOTES=$(awk '
            /^## Release Notes/           { found=1; next }
            found && /^## /               { exit }
            found && /<!--/               { in_comment=1 }
            found && /-->/                { in_comment=0; next }
            found && !in_comment          { print }
          ' /tmp/pr_body.txt |
            sed '/^[[:space:]]*$/d; s/^[[:space:]]*//; s/[[:space:]]*$//' || true)

          # Pattern match handles italics/asterisk variants of the sentinel
          # (_Auto-generated by CI._ or *Auto-generated by CI.*).
          if [[ -n "$NOTES" ]] && ! echo "$NOTES" | grep -qi "auto-generated by ci"; then
            # Random delimiter prevents injection if NOTES contains "EOF" on its own line.
            DELIM=$(openssl rand -hex 16)
            printf 'body<<%s\n%s\n%s\n' "$DELIM" "$NOTES" "$DELIM" >> "$GITHUB_OUTPUT"
            echo "use_ai=false" >> "$GITHUB_OUTPUT"
          else
            echo "use_ai=true" >> "$GITHUB_OUTPUT"
            # Use prev_tag passed via env (avoids re-sorting all tags).
            # v0.0.0 is synthetic (no real prior tag) — fall back to initial commit.
            PREV_TAG="${PREV_TAG_FROM_STEP:-}"
            [[ -z "$PREV_TAG" || "$PREV_TAG" == "v0.0.0" ]] && \
              PREV_TAG=$(git rev-list --max-parents=0 HEAD)
            COMMIT_LOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" | head -50 || true)
            DELIM=$(openssl rand -hex 16)
            printf 'commit_log<<%s\n%s\n%s\n' "$DELIM" "$COMMIT_LOG" "$DELIM" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Release Notes via AI
        id: ai_notes
        if: steps.pr_notes.outputs.use_ai == 'true'
        continue-on-error: true
        uses: actions/ai-inference@2c43c91ae16266ca159d311430343c67a5ffa222 # v3
        with:
          model: openai/gpt-4o-mini
          prompt: |
            Summarize these git commits as 1-3 plain prose sentences for a developer changelog. Key facts only. No fluff. No marketing language.

            Commits:
            ${{ steps.pr_notes.outputs.commit_log }}

      - name: Verify and complete reserved release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          ARTIFACT_RUN: ${{ needs.prepare.outputs.artifact_run || github.run_id }}
          RELEASE_NOTES: ${{ steps.pr_notes.outputs.body || (steps.ai_notes.outcome == 'success' && steps.ai_notes.outputs.response) || 'See commit history for changes in this release.' }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" > release-notes.txt
          python3 .github/scripts/release.py publish --release-id "$RELEASE_ID" \
            --run-id "$ARTIFACT_RUN" --artifacts artifacts --notes release-notes.txt
