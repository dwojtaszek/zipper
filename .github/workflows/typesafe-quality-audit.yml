# TypeSafe quality prioritization (#959): coverage gaps + surviving mutants.
# Advisory ranking only — deterministic tools (coverlet, Stryker) stay the
# source of truth for coverage and survivor status; TypeSafe never decides
# those. Scheduled weekly and manual dispatch; never on PRs.
name: typesafe-quality-audit

on:
  schedule:
    # Weekly full run, Mondays 08:00 UTC (after the requirements full audit).
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      scope:
        description: "Mutation shard scope (--mutate globs, comma-separated, relative to project root src/)"
        required: false
        default: "LoadFiles/**,PathValidator.cs,Validation/ProductionSetPostValidator.cs,ProductionSetOrchestrator.cs,ManifestComparison/ProductionManifestComparer.cs,ZipArchiveSink.cs,Emails/EmailFactory.cs,ChaosSampler.cs,DatAnomalyApplier.cs,OptAnomalyApplier.cs"
      break_at:
        description: "Mutation break threshold (0-100)"
        required: false
        default: "50"
      shard:
        description: "Per-shard mutation timeout in minutes"
        required: false
        default: "45"

permissions:
  contents: read

concurrency:
  group: typesafe-quality-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      assurance_status: ${{ steps.assurance-result.outputs.status || steps.secret-assurance.outputs.status }}
      assurance_executed: ${{ steps.assurance-result.outputs.executed || steps.secret-assurance.outputs.executed }}
      assurance_reason: ${{ steps.assurance-result.outputs.reason || steps.secret-assurance.outputs.reason }}
      assurance_json: ${{ steps.assurance-result.outputs.json || steps.secret-assurance.outputs.json }}
    steps:
      - name: Check secret availability (skips neutrally when absent)
        id: secret
        env:
          HAS_KEY: ${{ secrets.TYPESAFE_API_KEY != '' }}
        run: echo "available=$HAS_KEY" >> "$GITHUB_OUTPUT"

      - name: Neutral skip summary
        id: secret-assurance
        if: steps.secret.outputs.available != 'true'
        run: |
          mkdir -p results/typesafe-quality
          cat > results/typesafe-quality/assurance-result.json <<EOF
          {
            "executed": false,
            "scope": "quality",
            "sha": "${{ github.sha }}",
            "status": "unavailable",
            "reason": "missing_typesafe_api_key"
          }
          EOF
          {
            echo "status=unavailable"
            echo "executed=false"
            echo "reason=missing_typesafe_api_key"
            echo "scope=quality"
            echo "sha=${{ github.sha }}"
            echo "json={\"executed\":false,\"scope\":\"quality\",\"sha\":\"${{ github.sha }}\",\"status\":\"unavailable\",\"reason\":\"missing_typesafe_api_key\"}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Quality audit skipped"
            echo ""
            echo "TYPESAFE_API_KEY is not available in this context."
            echo ""
            echo "### Scheduled Assurance Result"
            echo '```json'
            cat results/typesafe-quality/assurance-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: steps.secret.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        if: steps.secret.outputs.available == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - name: Cache NuGet packages (tools only; never TypeSafe responses)
        if: steps.secret.outputs.available == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}

      - name: Restore pinned tools
        if: steps.secret.outputs.available == 'true'
        run: dotnet tool restore

      - name: Run tests with Cobertura coverage (Phase 1)
        if: steps.secret.outputs.available == 'true'
        run: |
          dotnet test src/Zipper.Tests/Zipper.Tests.csproj \
            --collect:"XPlat Code Coverage" \
            --results-directory results/coverage \
            -- DataCollectionRunParameters=CoverageFormats=Cobertura

      - name: Locate Cobertura report
        if: steps.secret.outputs.available == 'true'
        run: |
          COVERAGE_FILE=$(find results/coverage -name 'coverage.cobertura.xml' | head -1)
          echo "coverage_file=$COVERAGE_FILE" >> "$GITHUB_OUTPUT"
          test -n "$COVERAGE_FILE"
        id: coverage

      - name: Mutation testing shard (Phase 2)
        if: steps.secret.outputs.available == 'true'
        timeout-minutes: ${{ fromJSON(github.event.inputs.shard || '45') }}
        env:
          SCOPE: ${{ github.event.inputs.scope || 'LoadFiles/**,PathValidator.cs,Validation/ProductionSetPostValidator.cs,ProductionSetOrchestrator.cs,ManifestComparison/ProductionManifestComparer.cs,ZipArchiveSink.cs,Emails/EmailFactory.cs,ChaosSampler.cs,DatAnomalyApplier.cs,OptAnomalyApplier.cs' }}
          BREAK_AT: ${{ github.event.inputs.break_at || '50' }}
          SHARD_TIMEOUT: ${{ github.event.inputs.shard || '45' }}
        run: |
          # Scope is relative to project root src/; split comma-separated globs.
          MUTATE_ARGS=()
          IFS=',' read -ra ADDR <<< "$SCOPE"
          for item in "${ADDR[@]}"; do
            # Pure bash whitespace trimming and path prefix stripping (./, src/)
            item="${item#"${item%%[![:space:]]*}"}"
            item="${item%"${item##*[![:space:]]}"}"
            item="${item#./}"
            item="${item#src/}"
            item="${item#./}"
            if [ -n "$item" ]; then
              MUTATE_ARGS+=(--mutate "$item")
            fi
          done
          mkdir -p results/mutation
          STRYKER_THRESHOLDS=()
          if [ "$BREAK_AT" -gt 60 ] 2>/dev/null; then
            STRYKER_THRESHOLDS+=(--threshold-low "$BREAK_AT")
          fi
          if [ "$BREAK_AT" -gt 80 ] 2>/dev/null; then
            STRYKER_THRESHOLDS+=(--threshold-high "$BREAK_AT")
          fi
          STRYKER_RC=0
          (cd src && timeout "${SHARD_TIMEOUT}m" dotnet stryker \
            --project Zipper.csproj \
            --test-project Zipper.Tests/Zipper.Tests.csproj \
            "${MUTATE_ARGS[@]}" \
            "${STRYKER_THRESHOLDS[@]}" \
            --reporter json \
            --output "../results/mutation" \
            --break-at "$BREAK_AT" \
            --concurrency 4 \
            --skip-version-check) || STRYKER_RC=$?
          if [ -d results/mutation ]; then
            python3 tools/typesafe-audit/quality/normalize_report.py \
              --input results/mutation \
              --output results/mutation/mutation-report.json \
              --scope "$SCOPE" \
              --repo-root . || true
          fi
          if [ "$STRYKER_RC" -ne 0 ]; then
            echo "::error::dotnet stryker exited with code $STRYKER_RC"
            exit "$STRYKER_RC"
          fi

      - name: Run TypeSafe quality ranking (advisory)
        id: quality-ranking
        if: steps.secret.outputs.available == 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          set -o pipefail
          rc=0
          python3 tools/typesafe-audit/quality/run_check.py \
            --mode live \
            --coverage "${{ steps.coverage.outputs.coverage_file }}" \
            --mutation results/mutation/mutation-report.json \
            --json-out results/typesafe-quality/ranking.json \
            --md-out results/typesafe-quality/ranking.md \
            --summary-out "$GITHUB_STEP_SUMMARY" || rc=$?
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          if [ "$rc" -eq 3 ]; then
            # Advisory: API/remote failure never gates; raw artifacts are kept.
            echo "### Quality ranking unavailable (remote failure; advisory)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Input/config errors (2) and anything else fail the job per spec.
          exit "$rc"

      - name: Emit quality assurance result
        id: assurance-result
        if: always() && steps.secret.outputs.available == 'true'
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
          RANKING_OUTCOME: ${{ steps.quality-ranking.outcome }}
        run: |
          set -euo pipefail
          mkdir -p results/typesafe-quality
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          ranking_outcome = os.environ.get("RANKING_OUTCOME", "")
          sha = os.environ.get("COMMIT_SHA", "")
          ranking_json = Path("results/typesafe-quality/ranking.json")

          if ranking_json.exists():
              executed = True
              status = "executed"
              reason = "completed"
          elif ranking_outcome == "success":
              executed = False
              status = "unavailable"
              reason = "remote_failure"
          else:
              executed = False
              status = "failed"
              reason = "check_failed"

          result = {
              "executed": executed,
              "scope": "quality",
              "sha": sha,
              "status": status,
              "reason": reason,
          }

          os.makedirs("results/typesafe-quality", exist_ok=True)
          result_path = "results/typesafe-quality/assurance-result.json"
          with open(result_path, "w", encoding="utf-8") as f:
              json.dump(result, f, indent=2)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("### Scheduled Assurance Result\n\n```json\n" + json.dumps(result, indent=2) + "\n```\n\n")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"status={status}\n")
              f.write(f"executed={'true' if executed else 'false'}\n")
              f.write(f"reason={reason}\n")
              f.write("scope=quality\n")
              f.write(f"sha={sha}\n")
              f.write(f"json={json.dumps(result)}\n")
          PY

      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: typesafe-quality-report
          path: |
            results/coverage/**/coverage.cobertura.xml
            results/mutation/**
            results/typesafe-quality/ranking.json
            results/typesafe-quality/ranking.md
            results/typesafe-quality/assurance-result.json
          retention-days: 7
          if-no-files-found: warn

