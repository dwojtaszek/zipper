name: Functional QA

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      base_sha:
        description: Ancestor commit before the CLI change to test
        required: true
        type: string

concurrency:
  group: qa-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  weekly-smoke:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Run deterministic CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-results
          {
            dotnet build src/Zipper.csproj -c Release
            ./tests/run-e2e-basic.sh
          } 2>&1 | tee qa-results/weekly-smoke.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: weekly-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa-results/weekly-smoke.log
          if-no-files-found: warn
          retention-days: 14

  qa:
    needs: [weekly-smoke]
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && needs.weekly-smoke.result == 'success'))
    outputs:
      droid_outcome: ${{ steps.qa.outcome }}
      droid_available: ${{ steps.droid-key.outputs.available }}
      tools_outcome: ${{ steps.terminal-tools.outcome }}
      cli_outcome: ${{ steps.install-droid.outcome }}
      marketplace_outcome: ${{ steps.marketplace.outcome }}
      plugin_outcome: ${{ steps.plugin.outcome }}
    environment: QA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate QA output root
        shell: bash
        run: |
          set -euo pipefail
          [[ ! -L qa-results ]] || {
            echo "Refusing symlinked QA output root." >&2
            exit 1
          }
          mkdir -p -- qa-results
          repo_root="$(realpath -- .)"
          qa_root="$(realpath -- qa-results)"
          [[ -d qa-results && "$qa_root" == "$repo_root/qa-results" ]] || {
            echo "QA output root must be a directory inside the checkout." >&2
            exit 1
          }

      - name: Install QA workflow dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-yaml

      - name: Check QA report contract
        run: python3 tests/test-qa-report-gate.py

      - name: Read QA runtime configuration
        id: qa-config
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import yaml

          with open(".factory/skills/qa/config.yaml", encoding="utf-8") as config_file:
              config = yaml.safe_load(config_file)
          with open(".factory/settings.json", encoding="utf-8") as settings_file:
              settings = json.load(settings_file)

          values = {
              "imagemagick": config["imagemagick"],
              "video_evidence": config["video_evidence"],
              "compose": config["droid_control"]["compose"],
          }
          plugin = config["droid_control"]["plugin"]
          if not isinstance(plugin, str) or not plugin or "\n" in plugin or "\r" in plugin:
              raise SystemExit("Droid Control plugin must be a non-empty string.")
          plugin_name, separator, marketplace_name = plugin.partition("@")
          if plugin_name != "droid-control" or not separator or not marketplace_name:
              raise SystemExit("Droid Control plugin must use plugin@marketplace format.")
          marketplace = settings.get("extraKnownMarketplaces", {}).get(marketplace_name)
          source = marketplace.get("source") if isinstance(marketplace, dict) else None
          repo = source.get("repo") if isinstance(source, dict) else None
          sha = source.get("sha") if isinstance(source, dict) else None
          cli_patterns = config["apps"]["cli"]["path_patterns"]
          if any(type(value) is not bool for value in values.values()):
              raise SystemExit("QA runtime settings must be booleans.")
          if settings.get("enabledPlugins", {}).get(plugin) is not True:
              raise SystemExit("Droid Control plugin must be enabled in project settings.")
          if (
              not isinstance(source, dict)
              or source.get("source") != "github"
              or not isinstance(repo, str)
              or not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo)
              or not isinstance(sha, str)
              or not re.fullmatch(r"[0-9a-f]{40}", sha)
              or not marketplace_name.endswith(f"@{sha[:8]}")
          ):
              raise SystemExit("Droid Control marketplace must use its pinned GitHub commit.")
          if not isinstance(cli_patterns, list) or not cli_patterns or any(
              not isinstance(pattern, str) or not pattern or "\n" in pattern or "\r" in pattern
              for pattern in cli_patterns
          ):
              raise SystemExit("CLI path patterns must be a non-empty list of single-line strings.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              for name, value in values.items():
                  output_file.write(f"{name}={str(value).lower()}\n")
              output_file.write(f"plugin={plugin}\n")
              output_file.write(f"marketplace_url=https://github.com/{repo}@{sha}\n")
              output_file.write(f"cli_patterns={json.dumps(cli_patterns, separators=(',', ':'))}\n")
          PY

      - name: Validate diff base and determine CLI scope
        id: qa-scope
        shell: bash
        env:
          QA_DIFF_BASE: ${{ inputs.base_sha }}
          CLI_PATTERNS: ${{ steps.qa-config.outputs.cli_patterns }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            QA_DIFF_BASE="$(git rev-list --first-parent -1 --before='7 days ago' "$GITHUB_SHA")"
            [[ -n "$QA_DIFF_BASE" ]] || QA_DIFF_BASE="$(git rev-list --max-parents=0 "$GITHUB_SHA" | tail -1)"
            export QA_DIFF_BASE
            echo "Weekly diff base: $QA_DIFF_BASE"
          fi
          [[ "$QA_DIFF_BASE" =~ ^[0-9a-f]{40}$ ]] || {
            echo "QA diff base must be a 40-character commit SHA." >&2
            exit 1
          }
          git cat-file -e "${QA_DIFF_BASE}^{commit}" || {
            echo "QA diff base is not available in this checkout." >&2
            exit 1
          }
          git merge-base --is-ancestor "$QA_DIFF_BASE" "$GITHUB_SHA" || {
            echo "QA diff base must be an ancestor in protected main history." >&2
            exit 1
          }
          echo "diff_base=$QA_DIFF_BASE" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json
          import os
          import subprocess

          patterns = json.loads(os.environ["CLI_PATTERNS"])
          pathspecs = [f":(glob){pattern}" for pattern in patterns]
          result = subprocess.run(
              [
                  "git",
                  "diff",
                  "--name-only",
                  "-z",
                  "--no-renames",
                  os.environ["QA_DIFF_BASE"],
                  os.environ["GITHUB_SHA"],
                  "--",
                  *pathspecs,
              ],
              check=True,
              stdout=subprocess.PIPE,
          )
          changed_paths = [
              path.decode("utf-8", errors="replace")
              for path in result.stdout.split(b"\0")
              if path
          ]
          for path in changed_paths:
              print(f"CLI path changed: {path!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              output_file.write(f"cli_affected={'true' if changed_paths else 'false'}\n")
          PY

      - name: Check Droid availability
        id: droid-key
        if: steps.qa-scope.outputs.cli_affected == 'true'
        env:
          HAS_KEY: ${{ secrets.FACTORY_API_KEY != '' }}
        run: echo "available=$HAS_KEY" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.qa-scope.outputs.cli_affected == 'true' && (steps.droid-key.outputs.available == 'true' || github.event_name == 'workflow_dispatch')
        with:
          node-version: 22

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.qa-scope.outputs.cli_affected == 'true' && (steps.droid-key.outputs.available == 'true' || github.event_name == 'workflow_dispatch')
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install terminal QA tools
        id: terminal-tools
        if: steps.qa-scope.outputs.cli_affected == 'true' && (steps.droid-key.outputs.available == 'true' || github.event_name == 'workflow_dispatch')
        continue-on-error: ${{ github.event_name == 'schedule' }}
        shell: bash
        env:
          IMAGEMAGICK: ${{ steps.qa-config.outputs.imagemagick }}
          VIDEO_EVIDENCE: ${{ steps.qa-config.outputs.video_evidence }}
          COMPOSE: ${{ steps.qa-config.outputs.compose }}
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts --no-audit --no-fund tuistory@0.11.0
          packages=()
          [[ "$IMAGEMAGICK" != true ]] || packages+=(imagemagick)
          if [[ "$VIDEO_EVIDENCE" == true ]]; then
            packages+=(asciinema)
          fi
          if [[ "$VIDEO_EVIDENCE" == true && "$COMPOSE" == true ]]; then
            packages+=(ffmpeg cargo)
          fi
          if ((${#packages[@]})); then
            sudo apt-get install -y -qq "${packages[@]}"
          fi
          if [[ "$VIDEO_EVIDENCE" == true && "$COMPOSE" == true ]]; then
            cargo install --git https://github.com/asciinema/agg
          fi

      - name: Install Droid CLI
        id: install-droid
        if: steps.qa-scope.outputs.cli_affected == 'true' && (steps.droid-key.outputs.available == 'true' || github.event_name == 'workflow_dispatch')
        continue-on-error: ${{ github.event_name == 'schedule' }}
        run: npm install --global --ignore-scripts --no-audit --no-fund @factory/cli@0.226.2

      - name: Register pinned Droid Control marketplace
        id: marketplace
        if: steps.qa-scope.outputs.cli_affected == 'true' && (steps.droid-key.outputs.available == 'true' || github.event_name == 'workflow_dispatch') && steps.terminal-tools.outcome == 'success' && steps.install-droid.outcome == 'success'
        continue-on-error: ${{ github.event_name == 'schedule' }}
        env:
          MARKETPLACE_URL: ${{ steps.qa-config.outputs.marketplace_url }}
        run: droid plugin marketplace add "$MARKETPLACE_URL"

      - name: Install Droid Control plugin
        id: plugin
        if: steps.qa-scope.outputs.cli_affected == 'true' && (steps.droid-key.outputs.available == 'true' || github.event_name == 'workflow_dispatch') && steps.marketplace.outcome == 'success'
        continue-on-error: ${{ github.event_name == 'schedule' }}
        env:
          PLUGIN: ${{ steps.qa-config.outputs.plugin }}
        run: droid plugin install "$PLUGIN" --scope project

      - name: Run functional QA
        id: qa
        if: steps.qa-scope.outputs.cli_affected == 'true' && (steps.droid-key.outputs.available == 'true' || github.event_name == 'workflow_dispatch') && steps.plugin.outcome == 'success'
        continue-on-error: ${{ github.event_name == 'schedule' }}
        timeout-minutes: 20
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          QA_EVIDENCE_TOKEN: ${{ steps.qa-config.outputs.video_evidence == 'true' && secrets.QA_EVIDENCE_TOKEN || '' }}
          REPO_ID: ${{ github.event.repository.id }}
          CI: 'true'
          QA_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          QA_DIFF_BASE: ${{ steps.qa-scope.outputs.diff_base }}
          VIDEO_EVIDENCE: ${{ steps.qa-config.outputs.video_evidence }}
          COMPOSE: ${{ steps.qa-config.outputs.compose }}
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.factory/bin:$PATH"
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || {
            echo "Credentialed QA is allowed only from protected main." >&2
            exit 1
          }
          [[ -n "${FACTORY_API_KEY:-}" ]] || {
            echo "FACTORY_API_KEY is not configured." >&2
            exit 1
          }
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            prompt_extra="The weekly deterministic smoke suite already checks standard CLI outputs. Run exactly two change-specific cases not covered by that suite: one [positive] and one [negative] or [boundary]. Do not repeat mechanical file-count or format checks already covered by the smoke suite."
          else
            prompt_extra=''
          fi
          prompt="You are running in a non-interactive CI environment. There is NO human available. Do NOT use AskUser, do NOT wait for confirmations, and do NOT pause for input. Run the qa skill. The diff base is ${QA_DIFF_BASE}. Use droid-control for every terminal interaction and write the final report to qa-results/report.md. Use ${QA_RUN_ID} as RUN_ID and keep all build output and generated test data under qa-results/${QA_RUN_ID}, then clean only that run's data and publish directories."
          prompt+=" $prompt_extra"
          if [[ "$VIDEO_EVIDENCE" == true ]]; then
            prompt+=" Use droid-control Capture and upload video evidence per the QA skill's GitHub evidence rules."
          fi
          if [[ "$VIDEO_EVIDENCE" == true && "$COMPOSE" == true ]]; then
            prompt+=" Read the Compose setting from config.yaml and run droid-control Compose for each captured flow before upload."
          fi
          droid exec --model gpt-5.6-sol --reasoning-effort medium --auto high --tag "qa-run-$QA_RUN_ID" "$prompt"

      - name: Write no-app report
        if: steps.qa-scope.outputs.cli_affected == 'false'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-results
          cat > qa-results/report.md <<'REPORT'
          ## QA Report

          | #   | Test Case | App | Persona | Result | Notes |
          | --- | --------- | --- | ------- | ------ | ----- |
          | 1 | No app code changed | CLI | default | :grey_question: INCONCLUSIVE | No app code changed -- QA not applicable for this diff. |

          <details>
          <summary>Screenshots & Evidence</summary>

          No CLI path matching `.factory/skills/qa/config.yaml` changed.

          </details>
          REPORT

      - name: Validate QA report
        shell: bash
        if: success() && (github.event_name != 'schedule' || steps.qa.outcome == 'success' || steps.qa-scope.outputs.cli_affected == 'false')
        env:
          CLI_AFFECTED: ${{ steps.qa-scope.outputs.cli_affected }}
          QA_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -s qa-results/report.md
          grep -q '^## QA Report$' qa-results/report.md
          grep -Eq '^\|[[:space:]]*#[[:space:]]*\| Test Case \| App \| Persona \| Result \| Notes \|$' qa-results/report.md
          mapfile -t result_rows < <(grep -E '^\|[[:space:]]*[0-9]+[[:space:]]*\|' qa-results/report.md || true)
          if [[ "$CLI_AFFECTED" == false ]]; then
            if ((${#result_rows[@]} == 1)) &&
               [[ "${result_rows[0]}" == '| 1 | No app code changed | CLI | default | :grey_question: INCONCLUSIVE | No app code changed -- QA not applicable for this diff. |' ]]; then
              echo "No configured CLI path changed; accepting the required INCONCLUSIVE report."
              exit 0
            fi
            echo "No CLI path changed, but the report does not match the required INCONCLUSIVE row." >&2
            exit 1
          fi
          if ((${#result_rows[@]} < 2)); then
            echo "QA report must contain a successful flow and a negative or boundary flow." >&2
            exit 1
          fi
          [[ -d "qa-results/$QA_RUN_ID/evidence" &&
             ! -L qa-results &&
             ! -L "qa-results/$QA_RUN_ID" &&
             ! -L "qa-results/$QA_RUN_ID/evidence" ]] || {
            echo "QA evidence must be a real directory inside the run directory." >&2
            exit 1
          }
          evidence_links="$(sed -n '/^<summary>Screenshots & Evidence<\/summary>$/,/^<\/details>$/p' qa-results/report.md)"
          [[ "$evidence_links" == *'</details>'* ]] || {
            echo "QA report is missing its evidence block." >&2
            exit 1
          }
          has_positive=false
          has_negative_or_boundary=false
          expected_case_no=0
          for row in "${result_rows[@]}"; do
            if [[ ! "$row" =~ ^\|[[:space:]]*[0-9]+[[:space:]]*\|[^|]*\|[^|]*\|[^|]*\|[[:space:]]:white_check_mark:[[:space:]]PASS[[:space:]]\|[^|]*\|[[:space:]]*$ ]]; then
              echo "QA report contains a non-passing or malformed test result: $row" >&2
              exit 1
            fi
            case_no="$(awk -F '|' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2}' <<<"$row")"
            ((++expected_case_no))
            [[ "$case_no" == "$expected_case_no" ]] || {
              echo "QA report case numbers must be consecutive: $row" >&2
              exit 1
            }
            snapshot="qa-results/$QA_RUN_ID/evidence/case-$case_no.snapshot.txt"
            report_link="^[[:space:]]*-[[:space:]]+\\[[^]]+\\]\\($QA_RUN_ID/evidence/case-${case_no}[.]snapshot[.]txt\\)[[:space:]]*$"
            if [[ ! -f "$snapshot" || -L "$snapshot" || ! -s "$snapshot" ]] ||
               ! grep -Eq '^APP_EXIT:[0-9]+[[:space:]]*$' "$snapshot" ||
               ! grep -Eq '^[^[:cntrl:]]*[#$][[:space:]]+.*Zipper([[:space:].;]|$)' "$snapshot" ||
               ! grep -Eq "$report_link" <<<"$evidence_links"; then
              echo "QA report row $case_no requires a report-relative linked, raw terminal snapshot with APP_EXIT: $snapshot" >&2
              exit 1
            fi
            test_case="$(awk -F '|' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $3); print $3}' <<<"$row")"
            notes="$(awk -F '|' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $7); print $7}' <<<"$row")"
            [[ -n "$notes" ]] || {
              echo "QA report test row lacks observed evidence: $row" >&2
              exit 1
            }
            if [[ "$test_case" =~ ^\[positive\][[:space:]]+.+$ ]]; then
              has_positive=true
            fi
            if [[ "$test_case" =~ ^\[(negative|boundary)\][[:space:]]+.+$ ]]; then
              has_negative_or_boundary=true
            fi
          done
          [[ "$has_positive" == true && "$has_negative_or_boundary" == true ]] || {
            echo "QA report must label at least one [positive] and one [negative] or [boundary] test case." >&2
            exit 1
          }

      - name: Preserve run evidence and remove generated data
        if: always()
        shell: bash
        env:
          QA_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$QA_RUN_ID" =~ ^[0-9]+-[0-9]+$ ]] || exit 0
          [[ -d qa-results && ! -L qa-results ]] || exit 0
          qa_root="$(realpath -- qa-results)"
          run_dir="qa-results/$QA_RUN_ID"
          [[ ! -L "$run_dir" ]] || { echo "Refusing symlinked QA run directory" >&2; exit 1; }
          for name in data publish; do
            target="$run_dir/$name"
            [[ ! -L "$target" ]] || { echo "Refusing symlinked QA cleanup target: $target" >&2; exit 1; }
            resolved="$(realpath -m -- "$target")"
            [[ "$resolved" == "$qa_root/$QA_RUN_ID/$name" ]] || {
              echo "Refusing QA cleanup outside the run directory: $target" >&2
              exit 1
            }
            rm -rf -- "$target"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: qa-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa-results/
          if-no-files-found: warn
          retention-days: 14

  weekly-issue:
    if: always() && github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    needs: [weekly-smoke, qa]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: Open or update weekly improvement review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_RESULT: ${{ needs.weekly-smoke.result }}
          DROID_RESULT: ${{ needs.qa.result }}
          DROID_OUTCOME: ${{ needs.qa.outputs.droid_outcome }}
          DROID_AVAILABLE: ${{ needs.qa.outputs.droid_available }}
          TOOLS_RESULT: ${{ needs.qa.outputs.tools_outcome }}
          CLI_RESULT: ${{ needs.qa.outputs.cli_outcome }}
          MARKETPLACE_RESULT: ${{ needs.qa.outputs.marketplace_outcome }}
          PLUGIN_RESULT: ${{ needs.qa.outputs.plugin_outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          created_at="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          title="Weekly CLI QA improvement review $(date -u -d "$created_at" +%G-W%V)"
          {
            echo "Weekly QA run: $RUN_URL"
            echo "Commit: $GITHUB_SHA"
            echo
            echo "- Deterministic CLI smoke: $SMOKE_RESULT"
            echo "- Optional Droid job: $DROID_RESULT"
            echo "- Droid availability (key configured): ${DROID_AVAILABLE:-not checked}"
            echo "- Droid prerequisites (terminal / CLI / marketplace / plugin): ${TOOLS_RESULT:-skipped} / ${CLI_RESULT:-skipped} / ${MARKETPLACE_RESULT:-skipped} / ${PLUGIN_RESULT:-skipped}"
            echo "- Droid execution: ${DROID_OUTCOME:-skipped}"
            echo
            echo "Download the run's artifacts to inspect the smoke log and, when present, the Droid report and raw terminal snapshots."
            echo "If a check failed or Droid was unavailable, investigate that result before claiming a Zipper defect. If all checks passed, inspect recent changes and choose one concrete, reproducible CLI coverage improvement; do not invent a failure."
          } > weekly-issue.md
          number="$(gh issue list -R "$GITHUB_REPOSITORY" --state all --search "in:title \"$title\"" --limit 100 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" -R "$GITHUB_REPOSITORY" --body-file weekly-issue.md
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body-file weekly-issue.md --label testing --label P3
          fi
          cat weekly-issue.md >> "$GITHUB_STEP_SUMMARY"

  report-blocked:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Write blocked QA report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-results
          cat > qa-results/report.md <<'REPORT'
          ## QA Report

          | # | Test Case | App | Persona | Result | Notes |
          | --- | --- | --- | --- | --- | --- |
          | 1 | Functional QA | CLI | default | :no_entry: BLOCKED | Credentialed QA can run only from protected `main`. |

          <details>
          <summary>Screenshots & Evidence</summary>

          No app interaction was run because the dispatch ref is not `main`.

          </details>
          REPORT

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qa-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa-results/report.md
          if-no-files-found: warn
          retention-days: 14
