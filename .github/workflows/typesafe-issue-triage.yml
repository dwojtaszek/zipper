# TypeSafe issue triage (#960) — DRY-RUN ONLY.
# Advisory: suggests subsystem, requirement IDs, issue type, priority evidence,
# and duplicate candidates in a report. Never labels, comments, closes,
# assigns, or creates issues; write-mode promotion is a separate reviewed PR.
name: typesafe-issue-triage

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Triage a single issue number (dry run)"
        required: false
        default: ""

permissions:
  contents: read
  issues: read

concurrency:
  group: typesafe-issue-triage-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      assurance_status: ${{ steps.assurance-result.outputs.status || steps.secret-assurance.outputs.status }}
      assurance_executed: ${{ steps.assurance-result.outputs.executed || steps.secret-assurance.outputs.executed }}
      assurance_reason: ${{ steps.assurance-result.outputs.reason || steps.secret-assurance.outputs.reason }}
      assurance_json: ${{ steps.assurance-result.outputs.json || steps.secret-assurance.outputs.json }}
    steps:
      - name: Check secret availability (skips neutrally when absent)
        id: secret
        env:
          HAS_KEY: ${{ secrets.TYPESAFE_API_KEY != '' }}
        run: echo "available=$HAS_KEY" >> "$GITHUB_OUTPUT"

      - name: Neutral skip summary
        id: secret-assurance
        if: steps.secret.outputs.available != 'true'
        run: |
          mkdir -p results/typesafe-triage
          cat > results/typesafe-triage/assurance-result.json <<EOF
          {
            "executed": false,
            "scope": "triage",
            "sha": "${{ github.sha }}",
            "status": "unavailable",
            "reason": "missing_typesafe_api_key"
          }
          EOF
          {
            echo "status=unavailable"
            echo "executed=false"
            echo "reason=missing_typesafe_api_key"
            echo "scope=triage"
            echo "sha=${{ github.sha }}"
            echo "json={\"executed\":false,\"scope\":\"triage\",\"sha\":\"${{ github.sha }}\",\"status\":\"unavailable\",\"reason\":\"missing_typesafe_api_key\"}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Issue triage skipped (dry run)"
            echo ""
            echo "TYPESAFE_API_KEY is not available in this context."
            echo ""
            echo "### Scheduled Assurance Result"
            echo '```json'
            cat results/typesafe-triage/assurance-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout (trusted default-branch code only)
        if: steps.secret.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Collect issue context
        # Issue content is untrusted DATA: only the issue NUMBER crosses the
        # shell boundary (env var); bodies/comments are read via gh API JSON.
        if: steps.secret.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
        run: |
          python3 tools/typesafe-audit/triage/collect_issue.py \
            "$ISSUE_NUMBER" results/typesafe-triage/issue-input.json

      - name: Run TypeSafe triage (dry run, advisory)
        id: triage-check
        if: steps.secret.outputs.available == 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          set -o pipefail
          rc=0
          python3 tools/typesafe-audit/triage/run_check.py \
            --mode live \
            --issue-json results/typesafe-triage/issue-input.json \
            --json-out results/typesafe-triage/triage.json \
            --md-out results/typesafe-triage/triage.md \
            --summary-out "$GITHUB_STEP_SUMMARY" || rc=$?
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          if [ "$rc" -eq 3 ]; then
            # Advisory: API/remote failure is a neutral result.
            echo "### Issue triage unavailable (remote failure; advisory)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$rc"

      - name: Emit triage assurance result
        id: assurance-result
        if: always() && steps.secret.outputs.available == 'true'
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
          TRIAGE_OUTCOME: ${{ steps.triage-check.outcome }}
        run: |
          set -euo pipefail
          mkdir -p results/typesafe-triage
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          triage_outcome = os.environ.get("TRIAGE_OUTCOME", "")
          sha = os.environ.get("COMMIT_SHA", "")
          triage_json = Path("results/typesafe-triage/triage.json")

          if triage_json.exists():
              executed = True
              status = "executed"
              reason = "completed"
          elif triage_outcome == "success":
              executed = False
              status = "unavailable"
              reason = "remote_failure"
          else:
              executed = False
              status = "failed"
              reason = "check_failed"

          result = {
              "executed": executed,
              "scope": "triage",
              "sha": sha,
              "status": status,
              "reason": reason,
          }

          os.makedirs("results/typesafe-triage", exist_ok=True)
          result_path = "results/typesafe-triage/assurance-result.json"
          with open(result_path, "w", encoding="utf-8") as f:
              json.dump(result, f, indent=2)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("### Scheduled Assurance Result\n\n```json\n" + json.dumps(result, indent=2) + "\n```\n\n")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"status={status}\n")
              f.write(f"executed={'true' if executed else 'false'}\n")
              f.write(f"reason={reason}\n")
              f.write("scope=triage\n")
              f.write(f"sha={sha}\n")
              f.write(f"json={json.dumps(result)}\n")
          PY

      - name: Upload triage artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: typesafe-triage-report
          path: |
            results/typesafe-triage/triage.json
            results/typesafe-triage/triage.md
            results/typesafe-triage/assurance-result.json
          retention-days: 7
          if-no-files-found: warn
