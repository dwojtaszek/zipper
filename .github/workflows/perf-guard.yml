name: Perf Guard

on:
  pull_request:
    paths:
      - 'src/**'
      - '!src/Zipper.Tests/**'
      - '!src/Zipper.Analyzers/**'
      - '!src/Zipper.Analyzers.Tests/**'

jobs:
  perf-guard:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Publish Release binary
        run: dotnet publish src/Zipper.csproj -c Release -o publish-bin

      - name: Run perf measurements (5 runs)
        id: measure
        run: |
          mkdir -p results
          for i in $(seq 1 5); do
            ./tests/perf/measure.sh ./publish-bin/Zipper > "results/run_${i}.json"
          done

      - name: Compare against baselines (advisory)
        id: compare
        run: python3 .github/scripts/perf-compare.py results

      - name: Upload measurement artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-measurements
          path: results/

      - name: Post PR comment
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PERF_TABLE: ${{ steps.compare.outputs.table }}
        with:
          script: |
            const table = process.env.PERF_TABLE || 'No comparison table (measurement or comparison failed).';
            const measurementFailed = '${{ steps.measure.outcome }}' !== 'success' ||
              '${{ steps.compare.outcome }}' !== 'success';
            const highRss = '${{ steps.compare.outputs.failed }}' === 'true';
            const header = measurementFailed
              ? '## ❌ Performance Guard Failed (measurement or comparison error)'
              : highRss
                ? '## ⚠️ Performance Guard: high RSS (advisory)'
                : '## ✅ Performance Guard Passed';
            let body = `${header}\n\n${table}\n\n`;
            body += `_RSS > 1.20× baseline is advisory (median of 5 runs); ` +
              `wall_s is informational only. Measurement or comparison errors still fail the check._`;
            const marker = '<!-- perf-guard-comment -->';
            const fullBody = `${marker}\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }
